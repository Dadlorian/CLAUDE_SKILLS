version: '3.8'

services:
  hugo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hugo-docs
    ports:
      - "1313:80"
    environment:
      - TZ=UTC
      - HUGO_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - hugo-network

  # Development server
  dev:
    image: klakegg/hugo:latest
    container_name: hugo-dev
    volumes:
      - .:/src
      - hugo_resources:/src/resources
    ports:
      - "1314:1313"
    command: hugo server --bind 0.0.0.0 --destination=/tmp/hugo
    restart: on-failure
    networks:
      - hugo-network

networks:
  hugo-network:
    driver: bridge

volumes:
  hugo_resources:
