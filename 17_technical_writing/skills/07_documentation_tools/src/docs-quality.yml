# .github/workflows/docs-quality.yml
# Documentation quality checks on pull requests

name: Documentation Quality

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'docusaurus.config.js'
      - 'sidebars.js'

jobs:
  # 1. Prose and style quality
  prose:
    name: Prose Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Vale (Style Guide)
        uses: errata-ai/vale-action@v2
        with:
          files: docs
          version: 2.26.0

      - name: Comment PR with Vale results
        if: always()
        uses: actions/github-script@v6
        with:
          script: |
            const vale = require('./vale-results.json');
            // Comment with results

  # 2. Link validation
  links:
    name: Link Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build docs
        run: npm run build

      - name: Check links
        run: npx broken-link-checker ./build -o --filter-level=3
        continue-on-error: true

  # 3. Code sample validation
  code-samples:
    name: Code Sample Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install test dependencies
        run: npm ci

      - name: Test code samples
        run: npm run test:code-samples

  # 4. Accessibility checks
  accessibility:
    name: Accessibility Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build docs
        run: npm run build

      - name: Run Pa11y
        run: npx pa11y-ci --config .pa11y-ci.json
        continue-on-error: true

  # 5. SEO checks
  seo:
    name: SEO Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Check for missing meta descriptions
        run: |
          grep -r "description:" docs/ || echo "No descriptions found"

      - name: Validate XML sitemap
        run: |
          npm run build
          npx xmllint ./build/sitemap.xml

  # 6. Summary report
  summary:
    name: Quality Summary
    runs-on: ubuntu-latest
    needs: [prose, links, code-samples, accessibility, seo]
    if: always()
    steps:
      - name: Report quality status
        run: |
          echo "## Documentation Quality Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Prose | ${{ needs.prose.result == 'success' && '✅' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Links | ${{ needs.links.result == 'success' && '✅' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Code Samples | ${{ needs.code-samples.result == 'success' && '✅' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Accessibility | ${{ needs.accessibility.result == 'success' && '✅' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SEO | ${{ needs.seo.result == 'success' && '✅' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
