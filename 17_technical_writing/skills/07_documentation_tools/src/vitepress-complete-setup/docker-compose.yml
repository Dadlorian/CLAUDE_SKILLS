version: '3.8'

services:
  docs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vitepress-docs
    ports:
      - "5173:80"
    environment:
      - TZ=UTC
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - vitepress-network

  # Development server
  dev:
    image: node:18-alpine
    container_name: vitepress-dev
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "5174:5173"
    command: sh -c "npm install && npm run docs:dev -- --host"
    restart: on-failure
    networks:
      - vitepress-network

networks:
  vitepress-network:
    driver: bridge
