version: '3.8'

services:
  app:
    build:
      context: .
      args:
        VITE_API_URL: http://api:3001/api
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://api:3001/api
    depends_on:
      - api
    networks:
      - app-network

  api:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - ./scripts:/app
    ports:
      - "3001:3001"
    command: node mock-server.js
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
