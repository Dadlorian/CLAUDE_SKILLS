# Vale Configuration File - Comprehensive Style Enforcement
# Enterprise-grade style checking for technical documentation
# Version: 2.0

# Core Settings
StylesPath = styles
MinAlertLevel = warning
IgnoredScopes = code, pre
WordTemplate = ''

# Global format configuration
[formats]
ignore = {node_modules, .git, vendor, build, dist, coverage, .next}
plugins = {readability, grammar, consistency}

# Markdown files
[*.md]
BasedOnStyles = TechWriter, Google, Prose
TechWriter.Acronyms = error
TechWriter.Clichés = warning
TechWriter.CodeFormatting = error
TechWriter.Consistency = error
TechWriter.Contractions = warning
TechWriter.DeprecatedTerms = error
TechWriter.Headings = error
TechWriter.Jargon = warning
TechWriter.Numbers = warning
TechWriter.Passive = warning
TechWriter.Punctuation = warning
TechWriter.Readability = warning
TechWriter.API = error
TechWriter.CapitalizationConsistency = error
TechWriter.CommandFormatting = error
TechWriter.Emphasis = warning
TechWriter.FileNaming = error
TechWriter.GenderNeutrality = warning
TechWriter.Inclusivity = warning
TechWriter.ListFormatting = warning
TechWriter.MetaInformation = error
TechWriter.ProductConsistency = error
TechWriter.ScreenReaderOptimization = error
TechWriter.Spelling = error

# RST files
[*.rst]
BasedOnStyles = TechWriter, Google
TechWriter.Consistency = error
TechWriter.Headings = error
TechWriter.CodeFormatting = error

# Text files
[*.txt]
BasedOnStyles = Google, Prose

# Adoc files
[*.adoc]
BasedOnStyles = TechWriter, Google
TechWriter.Headings = error
TechWriter.CodeFormatting = error

# Token replacements and normalization
[*]
# Inclusive language replacements
match = '\bwhitelist\b'
replace = 'allowlist'
level = error

match = '\bblacklist\b'
replace = 'blocklist'
level = error

match = '\bslave\b'
replace = 'replica'
level = error

match = '\bmaster\b'
replace = 'primary'
level = error

match = '\bmanpower\b'
replace = 'personnel'
level = error

match = '\bghost\b(\s+code|ware|ing)'
replace = 'undocumented\1'
level = warning

# Technical consistency
match = '\b(CLI|CLI)\b'
replace = 'CLI'
level = warning

match = '\b(API|api)\b'
replace = 'API'
level = warning

match = '\b(JSON|json)\b'
replace = 'JSON'
level = warning

match = '\b(REST|rest)\b'
replace = 'REST'
level = warning

match = '\b(HTTP|http)\b'
replace = 'HTTP'
level = warning

# Discourage filler words
match = '\b(simply|just|obviously|clearly)\b'
replace = '[consider removing this filler word]'
level = suggestion
ignorecase = true

# Consistency in article usage
match = '\ba ([aeiou])'
replace = 'an \1'
level = warning

# URL consistency
match = 'http://'
replace = 'https://'
level = warning

# Common typos
match = '\brecieved\b'
replace = 'received'
level = error

match = '\bseperate\b'
replace = 'separate'
level = error

match = '\boccured\b'
replace = 'occurred'
level = error

match = '\bneccessary\b'
replace = 'necessary'
level = error

# Spacing issues
match = '\s{2,}'
replace = ' '
level = suggestion

# Enable rule customization per project
[project-specific-rules]
enabled = true

# Severity levels
[severity-levels]
error = 3
warning = 2
suggestion = 1
