# Vale configuration file for documentation style enforcement
# Place this in your repository root as .vale.ini

# Define where style packages are located
StylesPath = styles

# Minimum alert level to display (suggestion, warning, error)
MinAlertLevel = suggestion

# Configure rules for different file types
[*.md]
# Use these styles
BasedOnStyles = Google, Custom, ProseRules

# Specific rule settings for this file type
Google.Contractions = NO          # No contractions (don't, won't, etc.)
Google.Passive = YES              # Allow some passive voice
Google.Will = YES                 # Allow "will" for future tense
Google.Wordiness = ERROR          # Flag wordy phrases

[*.rst]
BasedOnStyles = Google

[*.txt]
BasedOnStyles = Google

# Ignore patterns (don't check these files)
[formats]
ignore = {node_modules, .git, vendor}

# Token substitutions
[*]
# Replace common mistakes
match = '\bwhitelist\b'
replace = 'allowlist'

match = '\bblacklist\b'
replace = 'blocklist'

match = '\bslave\b'
replace = 'replica'

match = '\bmaster\b'
replace = 'primary'

# Case-insensitive matching
match = '\b(simply|just)\b'
replace = '[omit this word]'
level = suggestion
ignorecase = true
