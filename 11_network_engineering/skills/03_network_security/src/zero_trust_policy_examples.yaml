# Zero Trust Architecture Policy Examples
# Production-Grade Security Policies

---
zero_trust_policies:
  
  # ========================================
  # Policy 1: User Identity Verification
  # ========================================
  user_authentication:
    mfa_required: true
    mfa_methods:
      - authenticator_app
      - hardware_token
      - biometric
    password_policy:
      minimum_length: 14
      complexity: true
      expiration_days: 90
      history_count: 5
    session_timeout: 480  # 8 hours
    
  # ========================================
  # Policy 2: Device Compliance
  # ========================================
  device_compliance:
    os_patching:
      windows: "within 30 days"
      macos: "within 30 days"
      linux: "within 30 days"
    encryption:
      disk: required
      type: "AES-256"
    antivirus:
      required: true
      signatures: "current"
    firewall:
      enabled: true
    endpoint_detection: true
  
  # ========================================
  # Policy 3: Network Access Control
  # ========================================
  network_access:
    default_action: DENY
    rules:
      - name: "User to Web Servers"
        source_identity: "authenticated_user"
        source_device: "compliant"
        destination: "web_servers"
        port: [80, 443]
        protocol: tcp
        action: ALLOW
        logging: true
        
      - name: "Admin to Infrastructure"
        source_identity: "network_admin"
        source_device: "admin_workstation"
        destination: "management_network"
        port: [22, 3389]
        protocol: tcp
        action: ALLOW
        mfa: true
        session_recording: true
        logging: true
        
      - name: "Service to Database"
        source: "app_server"
        destination: "database_cluster"
        port: [3306, 5432]
        protocol: tcp
        action: ALLOW
        encryption: "TLS1.2+"
        logging: true
        
      - name: "Guest Network Isolation"
        source: "guest_network"
        destination: "internal_network"
        action: DENY
        logging: true
  
  # ========================================
  # Policy 4: Data Protection
  # ========================================
  data_protection:
    encryption_in_transit:
      enabled: true
      minimum_version: "TLS1.2"
      cipher_suites:
        - "AES-256-GCM"
        - "ChaCha20-Poly1305"
    
    encryption_at_rest:
      enabled: true
      algorithm: "AES-256"
      key_rotation_days: 365
    
    data_classification:
      public:
        encryption: optional
        access: unrestricted
      internal:
        encryption: required
        access: authenticated_users
      confidential:
        encryption: required
        access: authorized_users_mfa
      restricted:
        encryption: required
        access: privileged_users_mfa
        logging: all_access
  
  # ========================================
  # Policy 5: Continuous Verification
  # ========================================
  continuous_verification:
    user_verification_interval: "hourly"
    device_verification_interval: "hourly"
    risk_assessment:
      enabled: true
      threshold: 50
      action: "require_reauthentication"
    
    behavioral_analysis:
      enabled: true
      anomalies_trigger:
        - "unusual_location"
        - "unusual_time"
        - "unusual_resource_access"
        - "impossible_travel"
        - "failed_login_spike"
      action: "block_and_investigate"
  
  # ========================================
  # Policy 6: Incident Response
  # ========================================
  incident_response:
    threat_detected:
      action: "immediate_isolation"
      steps:
        - revoke_session_tokens
        - block_network_access
        - notify_security_team
        - initiate_investigation
        - preserve_forensics
    
    breach_confirmed:
      actions:
        - disconnect_user
        - quarantine_device
        - scan_for_indicators
        - notify_stakeholders
        - trigger_forensics
        - update_threat_intel
  
  # ========================================
  # Policy 7: Privileged Access Management
  # ========================================
  privileged_access:
    admin_access:
      approval_required: true
      session_duration_max: 4  # hours
      recording: true
      logging: all_activity
      mfa: required
      jump_host: required
    
    elevated_operations:
      approval_workflow: true
      approval_levels: 2  # require 2 approvals
      audit_trail: complete
      post_operation_review: true

  # ========================================
  # Policy 8: Application Access
  # ========================================
  application_access:
    saas_applications:
      authentication: "oauth_via_idp"
      mfa: "conditional"
      monitoring: "enabled"
    
    on_premises_apps:
      authentication: "windows_auth + mfa"
      encryption: "required"
      segmentation: "application_tier"
    
    api_access:
      authentication: "oauth2 or jwt"
      rate_limiting: "enabled"
      tls: "1.2+"
      logging: "all_calls"

# Implementation Timeline
implementation:
  phase_1: "identity_mfa"
  phase_2: "device_compliance"
  phase_3: "network_segmentation"
  phase_4: "continuous_monitoring"
  phase_5: "incident_response"
  phase_6: "optimization"
