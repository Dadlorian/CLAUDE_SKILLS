# NGINX Reverse Proxy Cache Configuration
# File: /etc/nginx/nginx.conf or /etc/nginx/conf.d/cache.conf

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    '"$upstream_cache_status" "$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Performance tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss
               application/javascript application/json;

    # Brotli compression (if available)
    brotli on;
    brotli_comp_level 6;
    brotli_types text/plain text/css text/xml text/javascript
                 application/x-javascript application/xml+rss
                 application/javascript application/json;

    # Cache paths
    # Level 1: 1 directory level, Level 2: 2 directory levels
    # Keys_zone: Cache name and size in memory
    # Max_size: Maximum disk size
    # Inactive: Time to keep unused files
    proxy_cache_path /var/cache/nginx/cache levels=1:2
                     keys_zone=cache:10m max_size=1g inactive=7d;

    proxy_cache_path /var/cache/nginx/api_cache levels=1:2
                     keys_zone=api_cache:50m max_size=100m inactive=1h;

    # Cache lock (prevent thundering herd)
    proxy_cache_lock on;
    proxy_cache_lock_timeout 5s;

    # Upstream backend servers
    upstream backend {
        least_conn;  # Connection-based load balancing

        server origin.example.com:80 weight=5 max_fails=3 fail_timeout=30s;
        server origin2.example.com:80 weight=3 max_fails=3 fail_timeout=30s;
        server origin3.example.com:80 weight=2 max_fails=3 fail_timeout=30s;

        # Connection pooling
        keepalive 32;
    }

    # Main server block
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name example.com www.example.com;

        # Redirect HTTP to HTTPS
        return 301 https://$server_name$request_uri;
    }

    # HTTPS server block with caching
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name example.com www.example.com;

        # SSL configuration
        ssl_certificate /etc/ssl/certs/example.com.crt;
        ssl_certificate_key /etc/ssl/private/example.com.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # HSTS header
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Root location
        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;

            # Proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Cache settings for HTML
            proxy_cache cache;
            proxy_cache_valid 200 1h;
            proxy_cache_valid 404 10m;
            proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_lock on;

            # Cache key (include device type)
            proxy_cache_key "$scheme$request_method$host$request_uri$http_accept_encoding";

            # Add cache status header
            add_header X-Cache-Status $upstream_cache_status;
            add_header X-Cache-Age $upstream_response_time;
        }

        # Static assets (long cache)
        location ~* \.(js|css|jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf)$ {
            proxy_pass http://backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";

            # Cache for long time
            proxy_cache cache;
            proxy_cache_valid 200 30d;  # Cache for 30 days
            proxy_cache_valid 404 1d;   # Cache 404 for 1 day
            proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
            proxy_cache_key "$scheme$host$request_uri";

            # Browser cache
            expires 30d;

            add_header X-Cache-Status $upstream_cache_status;
            add_header Cache-Control "public, immutable, max-age=2592000";
        }

        # API endpoints (short cache)
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";

            # Cache API responses
            proxy_cache api_cache;
            proxy_cache_valid 200 5m;    # Cache 5 minutes
            proxy_cache_valid 404 1m;
            proxy_cache_bypass $http_cache_control;  # Bypass on Cache-Control header
            proxy_cache_key "$scheme$request_method$host$request_uri$http_accept_encoding";

            add_header X-Cache-Status $upstream_cache_status;
        }

        # Bypass cache for admin and user accounts
        location ~* ^/(admin|user|account)/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";

            # Don't cache
            proxy_no_cache 1;
            proxy_cache_bypass 1;
        }

        # Purge cache endpoint (optional, restrict access)
        location ~ /purge(/.*) {
            # Restrict to internal IPs
            allow 192.168.1.0/24;
            allow 127.0.0.1;
            deny all;

            proxy_cache_purge cache "$scheme$request_method$host$1$http_accept_encoding";
            proxy_cache_purge api_cache "$scheme$request_method$host$1$http_accept_encoding";
        }

        # Cache statistics endpoint
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 192.168.1.0/24;
            deny all;
        }
    }

    # Include additional configurations
    include /etc/nginx/conf.d/*.conf;
}
