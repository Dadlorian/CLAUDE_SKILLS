// BIND 9 Authoritative DNS Server Configuration
// File: /etc/bind/named.conf
// Example configuration for authoritative-only DNS server

// Define access control lists
acl "secondaries" {
  192.0.2.2;      // ns2.example.com
  192.0.2.3;      // ns3.example.com
  203.0.113.1;    // Off-site backup
};

acl "internal-networks" {
  192.168.0.0/16;
  10.0.0.0/8;
};

// Logging configuration
logging {
  channel default_log {
    file "/var/log/bind/default.log" versions 3 size 100M;
    severity info;
    print-time yes;
    print-severity yes;
    print-category yes;
  };

  channel query_log {
    file "/var/log/bind/query.log" versions 10 size 100M;
    print-time yes;
    print-category yes;
    print-severity yes;
  };

  channel zone_transfer_log {
    file "/var/log/bind/zone-transfer.log" versions 5 size 50M;
    print-time yes;
  };

  category default { default_log; };
  category queries { query_log; };
  category xfer-in { zone_transfer_log; };
  category xfer-out { zone_transfer_log; };
};

// Options for authoritative server
options {
  directory "/var/cache/bind";
  listen-on port 53 { any; };
  listen-on-v6 port 53 { any; };

  // Recursion: disabled for authoritative-only
  recursion no;
  allow-recursion { none; };

  // Query restrictions
  allow-query { any; };
  allow-query-cache { none; };

  // Zone transfer restrictions
  allow-transfer { "secondaries"; };

  // DNSSEC
  dnssec-policy default;
  auto-dnssec maintain;
  inline-signing yes;

  // Performance tuning
  max-cache-size 256M;
  tcp-clients 100;
  tcp-listen-queue 10;

  // Queries to root nameserver (for zone delegation)
  allow-recursion { none; };

  // Root hints
  hint-file "/etc/bind/db.root";

  // Rate limiting for DDoS protection
  rate-limit {
    responses-per-second 20;
    nxdomain-per-second 10;
    all-per-second 100;
    errors-per-second 5;
    window 15;
    log-only no;
  };

  // Query logging options
  querylog yes;

  // Version string (hide BIND version)
  version "HIDDEN";

  // Server ID
  server-id "ns1.example.com";

  // Notify settings
  notify yes;
  notify-delay 5;
  notify-to-soa yes;

  // Zone file defaults
  zone-statistics full;
};

// Root zone (required, even if no queries)
zone "." {
  type hint;
  file "/etc/bind/db.root";
};

// Localhost zones
zone "localhost" {
  type master;
  file "/etc/bind/zones/db.localhost";
};

zone "127.in-addr.arpa" {
  type master;
  file "/etc/bind/zones/db.127";
};

zone "0.in-addr.arpa" {
  type master;
  file "/etc/bind/zones/db.0";
};

zone "255.in-addr.arpa" {
  type master;
  file "/etc/bind/zones/db.255";
};

// Primary zones (authoritative master)
zone "example.com" {
  type master;
  file "/etc/bind/zones/db.example.com.signed";  // Use .signed for DNSSEC

  // Zone transfer settings
  allow-transfer { "secondaries"; };
  allow-update { none; };  // No dynamic DNS

  // Notify secondaries on zone update
  notify yes;
  notify-delay 5;
  also-notify { 192.0.2.2; 192.0.2.3; };

  // DNSSEC settings
  dnssec-policy default;
  auto-dnssec maintain;
  inline-signing yes;
};

// Reverse zone for 192.0.2.0/24
zone "0.0.192.in-addr.arpa" {
  type master;
  file "/etc/bind/zones/db.192.0.2";

  allow-transfer { "secondaries"; };
  allow-update { none; };

  notify yes;
  also-notify { 192.0.2.2; 192.0.2.3; };
};

// Additional zones
zone "subdomain.example.com" {
  type master;
  file "/etc/bind/zones/db.subdomain.example.com";

  allow-transfer { "secondaries"; };
  notify yes;
  also-notify { 192.0.2.2; 192.0.2.3; };

  dnssec-policy default;
  auto-dnssec maintain;
  inline-signing yes;
};

// Statistics channel for monitoring
statistics-channels {
  inet 127.0.0.1 port 8053 allow { 127.0.0.1; 192.168.1.0/24; };
};
