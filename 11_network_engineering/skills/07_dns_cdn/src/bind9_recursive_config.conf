// BIND 9 Recursive Resolver Configuration
// File: /etc/bind/named.conf
// Configuration for recursive resolver (public or internal)

// Define access control lists
acl "internal-networks" {
  192.168.0.0/16;     // Corporate network
  10.0.0.0/8;         // Data center
  203.0.113.0/24;     // Office network
  127.0.0.1;          // Localhost
};

acl "rate-limited" {
  any;                // Apply rate limiting to all
};

// Logging configuration
logging {
  channel default_log {
    file "/var/log/bind/default.log" versions 3 size 100M;
    severity info;
    print-time yes;
    print-severity yes;
    print-category yes;
  };

  channel query_log {
    file "/var/log/bind/query.log" versions 10 size 100M;
    print-time yes;
    print-category yes;
    severity debug;  // Verbose for troubleshooting
  };

  category default { default_log; };
  category queries { query_log; };
  category security { default_log; };
};

options {
  directory "/var/cache/bind";

  // Listen interfaces
  listen-on port 53 { any; };
  listen-on-v6 port 53 { any; };
  listen-on port 5353 { 127.0.0.1; };  // Local port for admin

  // Recursion: enabled for recursive resolver
  recursion yes;
  allow-recursion { "internal-networks"; };  // Only internal clients

  // Query restrictions
  allow-query { any; };
  allow-query-cache { "internal-networks"; };

  // No zone transfers (recursive only)
  allow-transfer { none; };

  // Cache settings
  max-cache-size 512M;
  max-cache-ttl 604800;  // 1 week
  max-ncache-ttl 86400;  // 1 day for negative cache

  // Performance tuning
  tcp-clients 200;
  tcp-listen-queue 50;
  max-clients 200;
  recursive-clients 1000;

  // Prefetch settings
  prefetch 10;           // Prefetch when < 10% of TTL remaining
  prefetch-key true;     // Prefetch DNSKEY records

  // DNSSEC validation
  dnssec-validation auto;
  trust-anchor-file "/etc/bind/dnssec-root-keys.txt";

  // Negative caching for non-existent domains
  negative-caching yes;
  negative-caching-min 300;
  negative-caching-max 86400;

  // Forwarders (optional, for conditional forwarding)
  forwarders { };  // Can add conditional forwarders below

  // Forward policy
  forward only;
  forward first;

  // Response rate limiting (DDoS protection)
  rate-limit {
    responses-per-second 100;      // Higher for recursive resolver
    nxdomain-per-second 20;
    all-per-second 200;
    errors-per-second 10;
    window 15;
    log-only no;
  };

  // Query logging
  querylog yes;

  // Hide BIND version
  version "HIDDEN";

  // Server ID
  server-id "resolver1.example.com";

  // Timeout settings
  timeout 30000;     // 30 second query timeout

  // Root hints
  hint-file "/etc/bind/db.root";

  // Interface tweaks for high-performance
  socket-pool-size 16;
  transfers-in 100;

  // Response padding for DNS privacy
  pad-answers yes;

  // Client subnet (EDNS Client Subnet)
  ecs yes;
  ecs-ipv4-prefix-length 24;
  ecs-ipv6-prefix-length 56;
};

// Root zone hints (for querying root servers)
zone "." {
  type hint;
  file "/etc/bind/db.root";
};

// Local zones (do not forward)
zone "localhost" {
  type master;
  file "/etc/bind/zones/db.localhost";
  allow-transfer { none; };
};

zone "127.in-addr.arpa" {
  type master;
  file "/etc/bind/zones/db.127";
  allow-transfer { none; };
};

zone "0.in-addr.arpa" {
  type master;
  file "/etc/bind/zones/db.0";
  allow-transfer { none; };
};

zone "255.in-addr.arpa" {
  type master;
  file "/etc/bind/zones/db.255";
  allow-transfer { none; };
};

// Conditional forwarding examples
zone "internal.example.com" {
  type forward;
  forward-policy only;
  forwarders { 192.168.1.10; 192.168.1.11; };  // Forward to internal AD DNS
};

zone "corp.example.com" {
  type forward;
  forward-policy only;
  forwarders { 192.168.1.10; };
};

// Stub zones (for NS delegation without full zone transfer)
zone "sub.example.com" {
  type stub;
  masters { 192.0.2.100; };
  file "/var/cache/bind/db.sub.example.com.stub";
};

// Statistics channel for monitoring
statistics-channels {
  inet 127.0.0.1 port 8053 allow { 127.0.0.1; 192.168.1.0/24; };
};

// Response policy zone (RPZ) for blocking malware domains
response-policy {
  zone "rpz.example.com" policy given;
};

zone "rpz.example.com" {
  type master;
  file "/etc/bind/zones/rpz.example.com";
  allow-update { none; };
};
