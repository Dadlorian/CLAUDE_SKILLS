// BIND 9 DNSSEC-Enabled Configuration
// File: /etc/bind/named.conf
// Complete BIND configuration with DNSSEC support

acl "secondaries" {
  192.0.2.2;
  192.0.2.3;
};

// Logging for DNSSEC
logging {
  channel default_log {
    file "/var/log/bind/default.log" versions 3 size 100M;
    severity info;
    print-time yes;
    print-severity yes;
    print-category yes;
  };

  channel dnssec_log {
    file "/var/log/bind/dnssec.log" versions 5 size 50M;
    severity info;
    print-time yes;
  };

  channel query_log {
    file "/var/log/bind/query.log" versions 10 size 100M;
    print-time yes;
  };

  category default { default_log; };
  category dnssec { dnssec_log; };
  category queries { query_log; };
};

options {
  directory "/var/cache/bind";
  listen-on port 53 { any; };
  listen-on-v6 port 53 { any; };

  // Recursion disabled (authoritative only)
  recursion no;
  allow-recursion { none; };

  // Query restrictions
  allow-query { any; };
  allow-transfer { "secondaries"; };

  // DNSSEC validation and signing
  dnssec-validation auto;

  // DNSSEC policy (automatic key management)
  // Requires BIND 9.16+
  dnssec-policy default {
    // Key Signing Key (KSK)
    keys {
      ksk lifetime unlimited algorithm ecdsap256sha256;
      zsk lifetime 30d algorithm ecdsap256sha256;
    };

    // Signing parameters
    signatures-refresh 5d;
    signatures-validity 2w;
    signatures-validity-dnskey 2w;

    // Key rollover
    dnskey-ttl 1800;
    publish-safety 3d;
    retire-safety 3d;
    standby-ds-days 30;

    // Zone parameters
    max-zone-ttl 86400;
    zone-propagation-delay 300s;

    // Parent DS parameters
    parent-ds-ttl 86400;
    parent-propagation-delay 1h;
  };

  // Auto-DNSSEC maintenance
  // Zone will be automatically signed
  auto-dnssec maintain;

  // Inline signing (sign zone in memory, not in file)
  inline-signing yes;

  // Root trust anchor for DNSSEC validation
  trust-anchor-file "/etc/bind/root.key";

  // Cache settings
  max-cache-size 256M;

  // Performance
  tcp-clients 100;
  recursive-clients 0;  // No recursive queries

  // Hide version
  version "HIDDEN";

  // Rate limiting
  rate-limit {
    responses-per-second 20;
    nxdomain-per-second 10;
    all-per-second 100;
    errors-per-second 5;
    window 15;
    log-only no;
  };
};

// Root zone
zone "." {
  type hint;
  file "/etc/bind/db.root";
};

// Localhost zones
zone "localhost" {
  type master;
  file "/etc/bind/zones/db.localhost";
};

zone "127.in-addr.arpa" {
  type master;
  file "/etc/bind/zones/db.127";
};

zone "0.in-addr.arpa" {
  type master;
  file "/etc/bind/zones/db.0";
};

zone "255.in-addr.arpa" {
  type master;
  file "/etc/bind/zones/db.255";
};

// Primary DNSSEC zone
zone "example.com" {
  type master;
  file "/etc/bind/zones/db.example.com";

  // Zone transfer settings
  allow-transfer { "secondaries"; };
  allow-update { none; };

  // Notify secondaries
  notify yes;
  also-notify { 192.0.2.2; 192.0.2.3; };

  // DNSSEC configuration
  // Auto-DNSSEC policy will:
  // - Generate keys if missing
  // - Sign zone automatically
  // - Manage key rotation
  // - Handle re-signing
  dnssec-policy default;
  auto-dnssec maintain;
  inline-signing yes;

  // Zone file options
  dnssec-loadkeys-interval 60;  // Check for new keys every 60 seconds
};

// Reverse zone (for PTR records)
zone "0.0.192.in-addr.arpa" {
  type master;
  file "/etc/bind/zones/db.192.0.2";

  allow-transfer { "secondaries"; };
  allow-update { none; };

  notify yes;
  also-notify { 192.0.2.2; 192.0.2.3; };

  dnssec-policy default;
  auto-dnssec maintain;
  inline-signing yes;
};

// Subdomain delegation
zone "sub.example.com" {
  type master;
  file "/etc/bind/zones/db.sub.example.com";

  allow-transfer { "secondaries"; };
  notify yes;
  also-notify { 192.0.2.2; 192.0.2.3; };

  dnssec-policy default;
  auto-dnssec maintain;
  inline-signing yes;
};

// Statistics channel for monitoring
statistics-channels {
  inet 127.0.0.1 port 8053 allow { 127.0.0.1; 192.168.1.0/24; };
};
