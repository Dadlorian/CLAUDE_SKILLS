# OpenVPN Server Configuration
# TLS-based VPN for remote access with RADIUS authentication

port 1194
proto udp
dev tun
topology subnet

# CA, certificate, and key files
ca ca.crt
cert server.crt
key server.key
dh dh2048.pem

# TLS authentication (additional security layer)
tls-crypt ta.key

# IP pool for clients
server 10.8.0.0 255.255.255.0
ifconfig-pool-persist ipp.txt

# DNS configuration
push "dhcp-option DNS 8.8.8.8"
push "dhcp-option DNS 1.1.1.1"
push "dhcp-option DOMAIN corp.internal"

# Routes: what networks clients can access
push "route 10.0.0.0 255.0.0.0"
push "route 192.168.0.0 255.255.0.0"

# Allow client-to-client communication
client-to-client

# Keepalive (detect dead connections)
keepalive 10 120

# Compression
compress lz4-v2
push "compress lz4-v2"

# Encryption and authentication
cipher AES-256-GCM
auth SHA256

# Performance tuning
sndbuf 393216
rcvbuf 393216
comp-lzo no

# Logging
status openvpn-status.log
log openvpn.log
log-append openvpn.log
verb 3
mute 20

# Security
user nobody
group nogroup
persist-key
persist-tun

# Administrative access
management 127.0.0.1 7505

# RADIUS authentication (optional)
# plugin /usr/lib/openvpn/openvpn-plugin-auth-radius.so /etc/openvpn/radius.cnf

# Connection limit (resource protection)
max-clients 500

# Certificate revocation list (if using)
# crl-verify crl.pem

# ==================== CLIENT CONFIGURATION EXAMPLE ====================
# client.conf for remote user:
#
# client
# proto udp
# remote vpn.company.com 1194
# dev tun
# ca ca.crt
# cert client.crt
# key client.key
# tls-crypt ta.key 1
# cipher AES-256-GCM
# auth SHA256
# keepalive 10 120
# compress lz4-v2
# comp-lzo no
# verb 3
#
# # Split tunneling (route only corporate traffic through VPN)
# route 10.0.0.0 255.0.0.0
# route 192.168.0.0 255.255.0.0
#
# # OR full tunnel (all traffic through VPN)
# # redirect-gateway def1
#
# # RADIUS authentication
# auth-user-pass
# auth-retry nointeract

# ==================== GENERATION COMMANDS ====================
# Generate CA certificate:
# openssl genrsa -out ca.key 2048
# openssl req -new -x509 -days 365 -key ca.key -out ca.crt
#
# Generate server certificate:
# openssl genrsa -out server.key 2048
# openssl req -new -key server.key -out server.csr
# openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out server.crt -days 365
#
# Generate DH parameters:
# openssl dhparam -out dh2048.pem 2048
#
# Generate TLS authentication key:
# openvpn --genkey --secret ta.key
#
# Generate client certificate:
# openssl genrsa -out client.key 2048
# openssl req -new -key client.key -out client.csr
# openssl x509 -req -in client.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out client.crt -days 365

# ==================== SYSTEMD SERVICE ====================
# /etc/systemd/system/openvpn@.service (if not already present):
#
# [Unit]
# Description=OpenVPN Tunneling Application on %i
# After=syslog.target network-online.target remote-fs.target nss-lookup.target
# Wants=network-online.target
# Documentation=man:openvpn(8)
# Documentation=https://community.openvpn.net/openvpn/wiki
#
# [Service]
# Type=notify
# PrivateTmp=yes
# WorkingDirectory=/etc/openvpn
# ExecStart=/usr/sbin/openvpn --daemon --writepid /var/run/openvpn.pid --cd /etc/openvpn --config %i.conf
# ExecReload=/bin/kill -HUP $MAINPID
# Restart=on-failure
# RestartSec=5
# StandardOutput=null
#
# [Install]
# WantedBy=multi-user.target

# ==================== STARTUP AND MANAGEMENT ====================
# Start service:
# sudo systemctl start openvpn@server
#
# Enable at boot:
# sudo systemctl enable openvpn@server
#
# Check status:
# sudo systemctl status openvpn@server
#
# View active connections:
# cat /var/log/openvpn-status.log
#
# Monitor log:
# tail -f /var/log/openvpn.log
#
# Reload configuration:
# sudo systemctl reload openvpn@server

# ==================== SECURITY CONSIDERATIONS ====================
# - Use AES-256-GCM for modern encryption
# - TLS-crypt adds extra security layer
# - RADIUS integration for enterprise auth
# - Certificate rotation (annual minimum)
# - CRL for certificate revocation
# - Monitor connection logs for anomalies
# - Implement firewall rules for port 1194
# - Use strong DH parameters (2048-bit minimum)
# - Regular security updates
# - Disable old clients (TLS 1.0, weak ciphers)

# ==================== FAILOVER CONFIGURATION ====================
# For high availability:
# 1. Deploy multiple OpenVPN servers
# 2. DNS round-robin or load balancer
# 3. Shared IP pool (database backend)
# 4. Replicate connection logs
# 5. Client connection timeout handling
