# OpenVPN Client Configuration
# Remote user connecting to corporate VPN

client
proto udp
remote vpn.company.com 1194
remote vpn-backup.company.com 1194  # Fallback server
float
nobind

dev tun
topology subnet

# TLS authentication
ca ca.crt
cert client1.crt
key client1.key
tls-crypt ta.key 1

# Encryption
cipher AES-256-GCM
auth SHA256

# Keepalive
keepalive 10 120

# Compression
compress lz4-v2
comp-lzo no

# DNS
dhcp-option DNS 10.0.0.1
dhcp-option DNS 8.8.8.8
dhcp-option DOMAIN corp.internal

# Split tunneling - only corporate networks through VPN
route 10.0.0.0 255.0.0.0
route 192.168.0.0 255.255.0.0

# Or use full tunnel - all traffic through VPN
# redirect-gateway def1

# Authentication (optional, for RADIUS)
# auth-user-pass
# auth-retry nointeract

# Logging
log openvpn.log
verb 3
mute 20

# Performance
sndbuf 393216
rcvbuf 393216

# Proxy settings (if needed)
# http-proxy proxy.company.com 3128
# http-proxy-retry

# Security
persist-key
persist-tun

# ==================== USAGE INSTRUCTIONS ====================
# Linux:
# sudo openvpn client.conf
#
# Or as service:
# sudo cp client.conf /etc/openvpn/client/
# sudo systemctl start openvpn-client@client
# sudo systemctl enable openvpn-client@client
#
# Windows:
# Place in: C:\Program Files\OpenVPN\config\
# Or: C:\Users\[User]\OpenVPN\config\
# Right-click OpenVPN GUI > Connect
#
# macOS:
# Using Tunnelblick: Import config file
# Or command line: sudo openvpn client.conf
