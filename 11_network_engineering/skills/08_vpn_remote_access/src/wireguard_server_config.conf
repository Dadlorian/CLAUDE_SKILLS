AllowedIPs = 10.255.0.3/32, 192.168.2.0/24
PersistentKeepalive = 25

# ==================== BRANCH 3 ====================
[Peer]
# Branch 3 Client Information
PublicKey = jF2m9K4L7mN0pQ3rS6t9U2v5W8x1Y4Z7a0B3c6D9e=
AllowedIPs = 10.255.0.4/32, 192.168.3.0/24
