# WireGuard VPN Server Configuration
# Hub-and-spoke topology with 3 client branches

[Interface]
# Server interface configuration
Address = 10.255.0.1/24
ListenPort = 51820
PrivateKey = KOhk3qbcO1aQ4QzLg2/T7jP8mR5vX9Y2W3Z4jK5lM6n=
SaveConfig = false

# Firewall integration (Linux)
PostUp = iptables -A FORWARD -i wg0 -j ACCEPT; iptables -A FORWARD -o wg0 -j ACCEPT; iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
PostDown = iptables -D FORWARD -i wg0 -j ACCEPT; iptables -D FORWARD -o wg0 -j ACCEPT; iptables -t nat -D POSTROUTING -o eth0 -j MASQUERADE

# Performance tuning (optional)
# MTU = 1420

# ==================== BRANCH 1 ====================
[Peer]
# Branch 1 Client Information
PublicKey = W8VAZfyXQPpWH6RpPmBaXYq8nR7K3jL5mN9pQ2rS4t=
AllowedIPs = 10.255.0.2/32, 192.168.1.0/24
# PersistentKeepalive required if branch is behind NAT
PersistentKeepalive = 25
# PreSharedKey = Z7x2bE5fH8iJ9K0L3mN2p5R6sT9u0V1w2X3y4Z5a= (optional)

# ==================== BRANCH 2 ====================
[Peer]
