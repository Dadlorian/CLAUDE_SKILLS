# ==================== CONFIGURATION NOTES ====================
# Generate keys: wg genkey | tee private.key | wg pubkey > public.key
#
# Enable on boot (Linux):
# systemctl enable wg-quick@wg0
#
# Start service:
# wg-quick up /etc/wireguard/wg0.conf
#
# View status:
# wg show
# wg show wg0 dump
#
# Monitor traffic:
# watch -n 1 'wg show wg0 transfer'
#
# Security considerations:
# - Restrict file permissions: chmod 600 /etc/wireguard/wg0.conf
# - Use PSK for additional security (optional)
# - Regular key rotation (annually recommended)
# - Monitor handshake timestamps
# - Implement firewall rules for WireGuard port

# ==================== FIREWALL RULES (UFW Example) ====================
# ufw allow 51820/udp
# ufw enable
#
# IP Forwarding required:
# sysctl -w net.ipv4.ip_forward=1
# Add to /etc/sysctl.conf:
# net.ipv4.ip_forward=1
# net.ipv4.conf.all.forwarding=1

# ==================== MONITORING ====================
# Check active connections:
# wg show wg0
#
# Verify peer latency:
# ping 10.255.0.2
#
# Monitor bandwidth:
# iftop -i wg0
#
# Log WireGuard events:
# journalctl -u wg-quick@wg0 -f
