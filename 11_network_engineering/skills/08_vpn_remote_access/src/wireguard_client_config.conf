# WireGuard Client Configuration
# Branch office connecting to HQ VPN hub

[Interface]
# Client tunnel interface
Address = 10.255.0.2/32
PrivateKey = gN9K4L1m0P5Q6r3S8t1U4v7W0x3Y6Z9a2B5c8D1e=
DNS = 10.0.0.1, 8.8.8.8
# Optional: specify mtu for connection optimization
# MTU = 1380

# Linux-specific: Firewall rules (optional)
# Allow traffic through VPN interface
PostUp = ip rule add not from all lookup 128; ip route add default dev wg0 table 128
PostDown = ip rule delete not from all lookup 128; ip route delete default dev wg0 table 128

[Peer]
# Server configuration
PublicKey = KOhk3qbcO1aQ4QzLg2/T7jP8mR5vX9Y2W3Z4jK5lM6n=
AllowedIPs = 10.255.0.0/24, 10.0.0.0/8, 192.168.0.0/16
Endpoint = vpn.company.com:51820

# Connection keepalive for NAT traversal
PersistentKeepalive = 25

# Optional: Pre-shared key for additional security (must match server config)
# PresharedKey = Z7x2bE5fH8iJ9K0L3mN2p5R6sT9u0V1w2X3y4Z5a=

# ==================== ALTERNATIVE SERVERS (Failover) ====================
# If primary fails, client can connect to backup
# Uncomment and configure as needed:
# [Peer]
# PublicKey = [BACKUP_SERVER_PUBLIC_KEY]
# AllowedIPs = 10.255.0.0/24, 10.0.0.0/8, 192.168.0.0/16
# Endpoint = vpn-backup.company.com:51820
# PersistentKeepalive = 25

# ==================== SPLIT TUNNELING (Optional) ====================
# Default: ALL traffic through VPN (recommended for security)
# AllowedIPs = 0.0.0.0/0, ::/0
#
# Alternative: Only corporate traffic through VPN
# AllowedIPs = 10.0.0.0/8, 192.168.0.0/16
# (Internet traffic goes directly to ISP)

# ==================== MOBILE CLIENT CONFIGURATION ====================
# For roaming clients (different IP each time):
# Remove "Endpoint = " line
# Server must NOT require fixed endpoint
# Keep PersistentKeepalive = 20 or less for mobile

# ==================== INSTALLATION & USAGE ====================
#
# Linux Installation:
# sudo apt-get install wireguard wireguard-tools
# sudo cp wireguard_client.conf /etc/wireguard/
# sudo chmod 600 /etc/wireguard/wireguard_client.conf
# sudo wg-quick up /etc/wireguard/wireguard_client.conf
# sudo systemctl enable wg-quick@wireguard_client
#
# To check status:
# sudo wg show
# sudo ip addr show wg0
#
# Windows Installation:
# 1. Download from https://www.wireguard.com/install/
# 2. Create config file: C:\Users\[User]\AppData\Local\WireGuard\Configs\
# 3. Open WireGuard app and activate tunnel
#
# macOS Installation:
# brew install wireguard-tools
# Or use App Store: https://apps.apple.com/us/app/wireguard/id1451685025
#
# iOS/Android:
# 1. Download WireGuard from App Store/Play Store
# 2. Create new tunnel or scan QR code
# 3. Activate VPN permission

# ==================== CONNECTIVITY TEST ====================
# Verify connection:
# ping 10.0.0.1 (HQ network)
# ping 192.168.0.1 (Another subnet)
#
# Measure throughput:
# iperf3 -c 10.0.0.1 -t 60 (transfer test)
#
# Check routing:
# ip route show (Linux)
# route print (Windows)
#
# Monitor traffic:
# sudo wg show wg0 (connection status)
# watch -n 1 'sudo wg show wg0 transfer' (bandwidth)

# ==================== SECURITY NOTES ====================
# - Keep private key secure (file permissions 600)
# - Consider PSK for additional security layer
# - DNS leak prevention (set DNS to corporate resolvers)
# - Verify server public key before connecting
# - Rotate keys annually for long-term connections
# - Monitor server endpoint changes (indicate compromise)
# - Use full tunnel (AllowedIPs = 0.0.0.0/0) for maximum security

# ==================== TROUBLESHOOTING ====================
# Connection refused:
# - Verify endpoint IP/hostname correct
# - Check firewall allows UDP 51820
# - Verify server is running
#
# Handshake failed:
# - Check public key matches server configuration
# - Verify PSK (if used) matches server
# - Check time synchronization (NTP)
# - Verify firewall not blocking UDP
#
# No internet access:
# - Check DNS settings
# - Verify AllowedIPs routing
# - Test with traceroute/mtr
#
# Slow performance:
# - Check MTU (test with ping -M do -s 1400)
# - Monitor CPU usage (compression overhead)
# - Verify no packet loss (ping -c 100)
# - Check network congestion (speedtest)
