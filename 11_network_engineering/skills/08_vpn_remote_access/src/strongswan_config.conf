# StrongSwan IPsec Configuration
# Open-source IPsec solution for Linux

conn %default
 ikelifetime=28800s
 keylife=3600s
 rekey=yes
 reauth=no
 dpdaction=restart
 dpddelay=30s
 dpdtimeout=150s

! ===================== SITE-TO-SITE CONNECTION =====================

conn site-to-site
 type=tunnel
 auto=start ! Start automatically
 left=%any
 leftid=@gateway-a.example.com
 leftsubnet=10.0.0.0/8
 leftfirewall=yes
 
 right=203.0.113.20
 rightid=@gateway-b.example.com
 rightsubnet=192.168.0.0/16
 
 ! IKEv2 configuration
 keyexchange=ikev2
 ike=aes256-sha256-modp2048!
 esp=aes256-sha256!
 
 pfs=yes
 authby=secret ! Use pre-shared key
 auth=mutual
 
 ! Aggressive mode (for mobile clients)
 aggressive=no
 
 ! Force encapsulation for NAT
 forceencaps=yes
 
 ! DPD settings
 dpdaction=restart
 dpddelay=10s
 dpdtimeout=60s

! ===================== REMOTE ACCESS CONFIGURATION =====================

conn remote-access
 type=tunnel
 auto=start
 left=%any
 leftauth=ike-sig
 leftcert=gateway.crt
 leftfirewall=yes
 
 right=%any
 rightauth=eap-mschapv2
 rightdns=10.0.0.1,8.8.8.8
 rightsourceip=10.8.0.0/24
 
 keyexchange=ikev2
 ike=aes256-sha256-modp2048!
 esp=aes256-sha256!
 
 pfs=yes
 reauth=yes
 reauth-time=1800
 
 eap_identity=%any
 fragmentation=yes
 compress=yes

! ===================== IPv6 SUPPORT =====================

conn ipv6-site-to-site
 type=tunnel
 auto=start
 left=%any
 leftid=@gateway-a.v6.example.com
 leftsubnet=2001:db8:a::/48
 
 right=2001:db8:b::1
 rightid=@gateway-b.v6.example.com
 rightsubnet=2001:db8:b::/48
 
 keyexchange=ikev2
 ike=aes256-sha256-modp3072!
 esp=aes256-sha256!

! ===================== FAILOVER & REDUNDANCY =====================

conn primary-site
 type=tunnel
 auto=start
 left=%any
 leftsubnet=10.0.0.0/8
 
 right=203.0.113.1
 rightsubnet=192.168.0.0/16
 
 keyexchange=ikev2
 ike=aes256-sha256-modp2048!
 esp=aes256-sha256!
 pfs=yes

conn backup-site
 type=tunnel
 auto=route ! Start on-demand
 left=%any
 leftsubnet=10.0.0.0/8
 
 right=203.0.113.2 ! Backup gateway
 rightsubnet=192.168.0.0/16
 
 keyexchange=ikev2
 ike=aes256-sha256-modp2048!
 esp=aes256-sha256!
 pfs=yes

! ===================== PERFORMANCE OPTIMIZATION =====================

conn performance-optimized
 type=tunnel
 auto=start
 left=%any
 leftsubnet=10.0.0.0/8
 
 right=203.0.113.20
 rightsubnet=192.168.0.0/16
 
 ! Stronger encryption for high-security
 keyexchange=ikev2
 ike=aes256-sha512-modp3072!
 esp=aes256-sha512!
 
 ! Weaker but faster encryption
 ! ike=aes128-sha256-modp2048!
 ! esp=aes128-sha256!
 
 pfs=yes
 dpdaction=clear
 dpddelay=60s

! ===================== CERTIFICATES & AUTHENTICATION =====================

! Pre-shared key in /etc/ipsec.secrets
! Format:
! @gateway-a.example.com @gateway-b.example.com : PSK "VerySecurePassword123!"

! Certificates in /etc/ipsec.d/certs/
! - gateway.crt (public certificate)
! - gateway.key (private key)
! - ca.crt (CA certificate)

! ===================== STARTUP COMMANDS =====================

! Start strongSwan daemon
! sudo systemctl start strongswan

! Start specific connection
! sudo ipsec up site-to-site

! Stop specific connection
! sudo ipsec down site-to-site

! Reload configuration
! sudo ipsec reload

! Show status
! sudo ipsec status

! Show SAD/SPD
! sudo ip xfrm state list
! sudo ip xfrm policy list

! ===================== TROUBLESHOOTING =====================

! Enable debug logging
! Edit /etc/strongswan.conf
! charon {
!   logging {
!     default = 2
!     plugins = 1
!   }
! }

! View logs
! sudo journalctl -u strongswan -f

! Monitor in real time
! sudo ipsec listall

! Test connectivity
! sudo ipsec status | grep site-to-site
! ping -I 10.0.0.1 192.168.0.1

