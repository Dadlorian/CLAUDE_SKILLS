# Cloud Network Security Policies

---
# WAF Rules Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: waf-rules
  namespace: security
data:
  waf-rules.json: |
    {
      "rules": [
        {
          "name": "AWSManagedRulesCommonRuleSet",
          "priority": 1,
          "statement": {
            "managedRuleGroupStatement": {
              "vendorName": "AWS",
              "name": "AWSManagedRulesCommonRuleSet"
            }
          },
          "action": {
            "block": {}
          },
          "visibilityConfig": {
            "sampledRequestsEnabled": true,
            "cloudWatchMetricsEnabled": true,
            "metricName": "AWSManagedRulesCommonRuleSetMetric"
          }
        },
        {
          "name": "RateLimitRule",
          "priority": 2,
          "statement": {
            "rateBasedStatement": {
              "limit": 2000,
              "aggregateKeyType": "IP"
            }
          },
          "action": {
            "block": {}
          },
          "visibilityConfig": {
            "sampledRequestsEnabled": true,
            "cloudWatchMetricsEnabled": true,
            "metricName": "RateLimitRuleMetric"
          }
        },
        {
          "name": "GeoBlockingRule",
          "priority": 3,
          "statement": {
            "geoMatchStatement": {
              "countryCodes": ["KP", "IR", "SY"]
            }
          },
          "action": {
            "block": {}
          },
          "visibilityConfig": {
            "sampledRequestsEnabled": true,
            "cloudWatchMetricsEnabled": true,
            "metricName": "GeoBlockingRuleMetric"
          }
        }
      ]
    }

---
# Network Security Policy - DDoS Protection
apiVersion: v1
kind: ConfigMap
metadata:
  name: ddos-policy
  namespace: security
data:
  ddos-config.yaml: |
    ddos_protection:
      enabled: true
      type: "shield_advanced"
      protection_levels:
        - layer: 3
          protection: "network_layer"
          techniques:
            - volumetric_attack_detection
            - syn_flood_protection
            - dns_query_flood_protection
        - layer: 4
          protection: "transport_layer"
          techniques:
            - connection_limit_enforcement
            - tcp_flag_anomaly_detection
        - layer: 7
          protection: "application_layer"
          techniques:
            - http_slowloris_protection
            - http_flood_detection
            - dns_query_pattern_analysis
      alert_thresholds:
        - attack_type: "volumetric"
          threshold_gbps: 25
        - attack_type: "protocol"
          threshold_pps: 50000
        - attack_type: "application"
          threshold_rps: 10000

---
# Zero Trust Architecture Policy
apiVersion: v1
kind: ConfigMap
metadata:
  name: zero-trust-policy
  namespace: security
data:
  zero-trust.yaml: |
    zero_trust_architecture:
      principles:
        - never_trust_always_verify: true
        - least_privilege: true
        - assume_breach: true
        - verify_explicitly: true
        - secure_by_default: true

      authentication:
        methods:
          - mfa: required
          - oauth2: enabled
          - saml: enabled
          - device_posture: required

      network_segmentation:
        micro_segmentation:
          enabled: true
          levels:
            - identity_based
            - role_based
            - data_classification_based
            - application_based

      data_protection:
        encryption:
          in_transit:
            protocol: "TLS_1_3"
            min_tls_version: "1.2"
            cipher_suites:
              - "TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384"
              - "TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384"
              - "TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305"
          at_rest:
            algorithm: "AES_256_GCM"
            key_rotation_days: 90

      monitoring:
        continuous_validation: true
        zero_trust_gateway: true
        conditional_access: true

---
# Network Segmentation Policy
apiVersion: v1
kind: ConfigMap
metadata:
  name: network-segmentation
  namespace: security
data:
  segmentation.yaml: |
    network_segments:
      - name: "dmz"
        cidr: "10.0.1.0/24"
        security_level: "high"
        data_classification: "public"
        access_controls:
          - source: "internet"
            protocols: ["http", "https"]
            destination_port: [80, 443]
          - source: "authenticated_users"
            protocols: ["all"]

      - name: "application_tier"
        cidr: "10.0.2.0/24"
        security_level: "high"
        data_classification: "internal"
        access_controls:
          - source: "dmz"
            destination_port: [8080, 8443]
          - source: "database_tier"
            destination_port: [5432]

      - name: "database_tier"
        cidr: "10.0.3.0/24"
        security_level: "critical"
        data_classification: "confidential"
        access_controls:
          - source: "application_tier"
            destination_port: [5432, 3306, 27017]

      - name: "management"
        cidr: "10.0.4.0/24"
        security_level: "critical"
        data_classification: "restricted"
        access_controls:
          - source: "authorized_admins"
            protocols: ["ssh", "rdp"]
            mfa_required: true

    encryption_requirements:
      in_transit: "mandatory_tls_1_2_or_higher"
      at_rest: "mandatory_aes_256"
      key_management: "hsm_backed"

    audit_logging:
      enabled: true
      retention_days: 90
      log_types:
        - access_logs
        - flow_logs
        - dns_query_logs
        - tls_handshake_logs

---
# Incident Response Policy
apiVersion: v1
kind: ConfigMap
metadata:
  name: incident-response
  namespace: security
data:
  incident-response.yaml: |
    incident_response:
      detection:
        siem_enabled: true
        anomaly_detection: true
        threat_intelligence_feed: true
        alert_severity_levels:
          - critical: "immediate_isolation"
          - high: "immediate_investigation"
          - medium: "scheduled_investigation"
          - low: "logged_for_review"

      response:
        auto_remediation: true
        isolation_actions:
          - network_isolation: true
          - traffic_redirection: true
          - workload_termination: true
        communication:
          notify_security_team: true
          notify_management: true
          notify_customers: "as_required"

      investigation:
        forensics_enabled: true
        traffic_capture: true
        log_preservation: true
        chain_of_custody: true

      recovery:
        rto_target_hours: 1
        rpo_target_minutes: 15
        failover_testing: "quarterly"
        backup_validation: "monthly"
