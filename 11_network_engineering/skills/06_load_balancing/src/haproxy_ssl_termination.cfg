# HAProxy SSL Termination Configuration
# HTTPS Load Balancing with SSL Offloading
# Last Updated: 2025-11-19

global
    log 127.0.0.1 local0 notice
    stats socket /run/haproxy/admin.sock mode 660 level admin
    user haproxy
    group haproxy
    daemon
    maxconn 4096

    # SSL optimization
    tune ssl default-dh-param 2048
    ssl-default-bind-options ssl-min-ver TLSv1.2
    ssl-default-bind-ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256
    ssl-default-server-options ssl-min-ver TLSv1.2
    ssl-default-server-ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384

defaults
    log     global
    mode    http
    option  httplog
    option  http-keep-alive
    option  forwardfor
    timeout connect 5000
    timeout client  50000
    timeout server  50000

#-----------
# Frontend: Redirect HTTP to HTTPS
#-----------
frontend http_redirect_in
    bind 0.0.0.0:80
    mode http

    # Redirect all HTTP to HTTPS
    http-request redirect scheme https code 301 if !{ ssl_fc }

#-----------
# Frontend: HTTPS with SNI
#-----------
frontend https_in
    bind 0.0.0.0:443 ssl \
        crt /etc/ssl/certs/example.com.pem \
        crt /etc/ssl/certs/api.example.com.pem \
        crt /etc/ssl/certs/admin.example.com.pem \
        crt /etc/ssl/certs/cdn.example.com.pem

    mode http
    timeout client 50000

    # SSL/TLS configuration
    # Protocols configured in global section (TLS 1.2, 1.3)
    # Ciphers configured for security

    # Default backend
    default_backend web_backend

    # Request processing
    http-request add-header X-Forwarded-Proto https
    http-request add-header X-Forwarded-For %[src]
    http-request add-header X-Real-IP %[src]

    # ACL definitions
    acl is_api hdr(host) -i api.example.com
    acl is_admin hdr(host) -i admin.example.com
    acl is_cdn hdr(host) -i cdn.example.com

    # SNI-based routing
    use_backend api_backend if is_api
    use_backend admin_backend if is_admin
    use_backend cdn_backend if is_cdn

    # Default
    default_backend web_backend

#-----------
# Backend: Web Application (HTTP backend)
#-----------
backend web_backend
    mode http
    balance roundrobin
    option httpchk GET /health HTTP/1.1\r\nHost:\ localhost
    option http-keep-alive

    timeout server 50000
    timeout connect 5000

    # SSL offloading - backend receives plain HTTP
    cookie JSESSIONID insert indirect nocache

    server web1 192.168.1.10:80 check cookie web1 inter 5000 rise 2 fall 3
    server web2 192.168.1.11:80 check cookie web2 inter 5000 rise 2 fall 3
    server web3 192.168.1.12:80 check cookie web3 inter 5000 rise 2 fall 3

#-----------
# Backend: API (HTTPS to backend with verification)
#-----------
backend api_backend
    mode http
    balance leastconn
    option httpchk GET /api/health HTTP/1.1\r\nHost:\ localhost

    timeout server 60000
    timeout connect 5000

    # HTTPS backend servers with SSL verification
    server api1 192.168.1.50:443 check ssl verify required ca-file /etc/ssl/certs/ca-bundle.crt inter 10000
    server api2 192.168.1.51:443 check ssl verify required ca-file /etc/ssl/certs/ca-bundle.crt inter 10000

#-----------
# Backend: Admin (HTTPS, stricter)
#-----------
backend admin_backend
    mode http
    balance roundrobin
    option httpchk GET /admin/health HTTP/1.1\r\nHost:\ localhost

    timeout server 60000
    timeout connect 5000

    # Stricter SSL verification for admin
    server admin1 192.168.1.70:8443 check ssl verify required ca-file /etc/ssl/certs/ca-bundle.crt sni str(admin.example.com)

#-----------
# Backend: CDN/Static (HTTP plain)
#-----------
backend cdn_backend
    mode http
    balance roundrobin
    option httpchk HEAD / HTTP/1.1\r\nHost:\ localhost

    timeout server 30000
    timeout connect 3000

    # Plain HTTP backend for CDN
    server cdn1 192.168.1.60:80 check weight 3 inter 5000 rise 2 fall 3
    server cdn2 192.168.1.61:80 check weight 3 inter 5000 rise 2 fall 3
    server cdn3 192.168.1.62:80 check weight 1 inter 5000 rise 2 fall 3

#-----------
# Frontend: Statistics
#-----------
frontend stats
    bind 0.0.0.0:8404
    stats enable
    stats uri /stats
    stats refresh 30s
    stats admin if TRUE
    mode http
    timeout client 5000

# SSL Certificate Configuration
# Paths: /etc/ssl/certs/example.com.pem
#        /etc/ssl/certs/api.example.com.pem
#        /etc/ssl/certs/admin.example.com.pem
#        /etc/ssl/certs/cdn.example.com.pem
#
# Each .pem file should contain:
# - Server certificate
# - Private key
# - Intermediate CA certificates (in order)
#
# Format: cat domain.crt domain.key ca-intermediate.crt > domain.pem
