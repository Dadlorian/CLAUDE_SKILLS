# HAProxy HTTP Load Balancing Configuration
# Production Web Application Load Balancer
# Last Updated: 2025-11-19

#-----------
# Global Configuration
#-----------
global
    log 127.0.0.1 local0 notice
    log 127.0.0.1 local1 info
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy
    daemon

    # Performance tuning
    maxconn 4096
    pidfile /var/run/haproxy.pid

    # Logging
    log-send-hostname
    log-tag haproxy

#-----------
# Defaults
#-----------
defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  http-keep-alive
    option  forwardfor except 127.0.0.0/8
    timeout connect 5000
    timeout client  50000
    timeout server  50000

    # Error files
    errorfile 400 /etc/haproxy/errors/400.http
    errorfile 403 /etc/haproxy/errors/403.http
    errorfile 408 /etc/haproxy/errors/408.http
    errorfile 500 /etc/haproxy/errors/500.http
    errorfile 502 /etc/haproxy/errors/502.http
    errorfile 503 /etc/haproxy/errors/503.http
    errorfile 504 /etc/haproxy/errors/504.http

#-----------
# Frontend: HTTP
#-----------
frontend http_in
    bind 0.0.0.0:80
    default_backend web_backend
    mode http
    timeout client 50000

    # Request processing
    http-request add-header X-Forwarded-For %[src]
    http-request add-header X-Real-IP %[src]
    http-request add-header X-Forwarded-Proto http

    # ACL definitions
    acl is_api path_beg /api
    acl is_static path_beg /static
    acl is_admin hdr(host) -i admin.example.com

    # Routing rules
    use_backend api_backend if is_api
    use_backend static_backend if is_static
    use_backend admin_backend if is_admin

    # Default backend
    default_backend web_backend

#-----------
# Frontend: Statistics
#-----------
frontend stats_in
    bind 0.0.0.0:8404
    stats enable
    stats uri /stats
    stats refresh 30s
    stats admin if TRUE
    mode http
    timeout client 5000

#-----------
# Backend: Web Application
#-----------
backend web_backend
    mode http
    balance roundrobin
    option httpchk GET /health HTTP/1.1\r\nHost:\ localhost
    option httpclose
    option forwardfor

    # Timeout settings
    timeout server 50000
    timeout connect 5000

    # Cookie-based session persistence
    cookie JSESSIONID insert indirect nocache

    # Servers with health checks and timeouts
    server web1 192.168.1.10:80 check cookie web1 weight 1 inter 5000 rise 2 fall 3
    server web2 192.168.1.11:80 check cookie web2 weight 1 inter 5000 rise 2 fall 3
    server web3 192.168.1.12:80 check cookie web3 weight 1 inter 5000 rise 2 fall 3

    # Minimum active members
    default-server inter 5000 rise 2 fall 3

#-----------
# Backend: API
#-----------
backend api_backend
    mode http
    balance leastconn
    option httpchk GET /api/health HTTP/1.1\r\nHost:\ localhost

    timeout server 60000
    timeout connect 5000

    # Rate limiting for API
    stick-table type ip size 100k expire 30s store http_req_rate(10s)
    http-request track-sc0 src
    http-request deny if { sc_http_req_rate(0) gt 100 }

    # Servers
    server api1 192.168.1.50:8080 check weight 1 inter 10000 rise 2 fall 3
    server api2 192.168.1.51:8080 check weight 1 inter 10000 rise 2 fall 3

#-----------
# Backend: Static Content
#-----------
backend static_backend
    mode http
    balance roundrobin
    option httpchk HEAD / HTTP/1.1\r\nHost:\ localhost

    # Cache-friendly settings
    http-reuse safe

    timeout server 30000
    timeout connect 3000

    # Weighted distribution
    server cdn1 192.168.1.60:80 check weight 3 inter 5000 rise 2 fall 3
    server cdn2 192.168.1.61:80 check weight 3 inter 5000 rise 2 fall 3
    server cdn3 192.168.1.62:80 check weight 1 inter 5000 rise 2 fall 3

#-----------
# Backend: Admin
#-----------
backend admin_backend
    mode http
    balance roundrobin
    option httpchk GET /admin/health HTTP/1.1\r\nHost:\ localhost

    timeout server 60000
    timeout connect 5000

    # Single admin server
    server admin1 192.168.1.70:8443 check ssl verify none weight 1

#-----------
# Logging Configuration
#-----------
# Enable detailed logging
global
    log-format "%ci:%cp [%tr] %ft %b/%s %TR/%Tw/%Tc/%Tr/%Ta %ST %B %CC %CS %tsc %ac/%fc/%bc/%sc/%rc %sq/%bq %hr %hs %{+Q}r"
