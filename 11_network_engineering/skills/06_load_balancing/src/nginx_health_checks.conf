# NGINX Health Check Configuration
# Advanced Health Monitoring Setup
# Last Updated: 2025-11-19

# HTTP health check configuration
upstream web_backend_health {
    # Servers with health check parameters
    server backend1.example.com max_fails=3 fail_timeout=30s;
    server backend2.example.com max_fails=3 fail_timeout=30s;
    server backend3.example.com max_fails=3 fail_timeout=30s;

    # NGINX Plus: Advanced Health Checks
    zone web_zone 64k;
    check interval=3000 rise=2 fall=5 timeout=1000 type=http;
    check_http_send "GET /health HTTP/1.0\r\n\r\n";
    check_http_expect_alive http_2xx http_3xx;
}

# API backend with custom health check
upstream api_backend_health {
    server api1.example.com:8080 max_fails=2 fail_timeout=20s;
    server api2.example.com:8080 max_fails=2 fail_timeout=20s;

    zone api_zone 64k;
    check interval=3000 rise=2 fall=3 timeout=2000 type=http;
    check_http_send "GET /api/v1/health HTTP/1.1\r\nHost: api.example.com\r\nConnection: close\r\n\r\n";
    check_http_expect_alive http_2xx;
}

# Database connection health check
upstream database_backend_health {
    server db1.example.com:3306;
    server db2.example.com:3306;
    server db3.example.com:3306;

    zone db_zone 64k;
    check interval=5000 rise=1 fall=2 timeout=3000 type=tcp;
}

# Cache service health check
upstream cache_backend_health {
    server cache1.example.com:6379;
    server cache2.example.com:6379;
    server cache3.example.com:6379;

    zone cache_zone 64k;
    check interval=5000 rise=1 fall=2 timeout=2000 type=tcp;
}

# Health check status endpoint
server {
    listen 8080;
    server_name localhost;

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # NGINX Plus: Upstream health status
    location /upstream_health {
        access_log off;
        default_type text/html;
        content_by_lua_block {
            local upstreams = {
                "web_backend_health",
                "api_backend_health",
                "database_backend_health",
                "cache_backend_health"
            }

            ngx.say("<html><body>")
            ngx.say("<h1>Upstream Health Status</h1>")
            ngx.say("<table border='1'>")
            ngx.say("<tr><th>Upstream</th><th>Server</th><th>Status</th></tr>")

            for _, upstream in ipairs(upstreams) do
                ngx.say("<tr><td>" .. upstream .. "</td>")
                ngx.say("<td>Various</td>")
                ngx.say("<td>See /api endpoint</td></tr>")
            end

            ngx.say("</table>")
            ngx.say("</body></html>")
        }
    }

    # API endpoint for health status (NGINX Plus)
    location /api/upstreams {
        api write=off;
        access_log off;
    }
}

# HTTP Server with health check integration
server {
    listen 443 ssl http2;
    server_name example.com www.example.com;

    ssl_certificate /etc/ssl/certs/example.com.crt;
    ssl_certificate_key /etc/ssl/private/example.com.key;

    # Main application with health checks
    location / {
        proxy_pass http://web_backend_health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Monitor if backend is healthy
        # Fail fast if all backends are down
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 10s;
    }

    # API with stricter health checks
    location /api/ {
        proxy_pass http://api_backend_health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        # API-specific health check retries
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_429;
        proxy_next_upstream_tries 1;
        proxy_next_upstream_timeout 5s;
    }

    # Health check itself
    location /health {
        access_log off;
        proxy_pass http://web_backend_health;
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
    }

    # Liveness probe for orchestration
    location /liveness {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Readiness probe for orchestration
    location /readiness {
        access_log off;
        # Check if at least one backend is healthy
        # This is simplified; in production use custom check
        return 200 "Ready\n";
        add_header Content-Type text/plain;
    }
}

# Configuration notes:
#
# Health check parameters:
#   interval: Time in ms between checks (default 3000)
#   rise: Consecutive passes to mark up (default 5)
#   fall: Consecutive failures to mark down (default 5)
#   timeout: Timeout in ms for each check (default 1000)
#   type: http, tcp, or udp
#
# HTTP specific:
#   check_http_send: HTTP request to send
#   check_http_expect_alive: Expected status codes (http_2xx, http_3xx, http_4xx, http_5xx)
#
# Advanced monitoring:
#   Use /api/upstreams to get real-time health status
#   Use /upstream_health for health dashboard
#   Configure alerting based on health status changes
