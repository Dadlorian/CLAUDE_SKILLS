# NGINX HTTP Load Balancing Configuration
# Production Web Application Load Balancer
# Last Updated: 2025-11-19

# Upstream backend definitions
upstream web_backend {
    # Weight-based distribution
    server backend1.example.com weight=3 max_fails=2 fail_timeout=30s;
    server backend2.example.com weight=2 max_fails=2 fail_timeout=30s;
    server backend3.example.com weight=1 max_fails=2 fail_timeout=30s;

    # Keep-alive connection pooling
    keepalive 32;
    keepalive_timeout 60s;
    keepalive_requests 100;
}

upstream web_backend_leastconn {
    least_conn;

    server backend1.example.com max_fails=3 fail_timeout=30s;
    server backend2.example.com max_fails=3 fail_timeout=30s;
    server backend3.example.com max_fails=3 fail_timeout=30s;

    keepalive 32;
}

upstream api_backend {
    least_conn;

    server api1.example.com:8080 max_fails=2 fail_timeout=20s;
    server api2.example.com:8080 max_fails=2 fail_timeout=20s;

    keepalive 64;
    keepalive_timeout 60s;
}

upstream static_backend {
    # Hash on request URI for cache locality
    hash $request_uri consistent;

    server cdn1.example.com weight=3;
    server cdn2.example.com weight=3;
    server cdn3.example.com weight=1;

    keepalive 32;
}

upstream database_backend {
    # IP hash for connection affinity
    ip_hash;

    server db1.example.com:3306 max_fails=2 fail_timeout=30s;
    server db2.example.com:3306 max_fails=2 fail_timeout=30s;
    server db3.example.com:3306 max_fails=2 fail_timeout=30s;

    keepalive 32;
}

# HTTP Server Configuration
server {
    listen 80;
    server_name example.com www.example.com;

    # Redirect to HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS Server Configuration
server {
    listen 443 ssl http2;
    server_name example.com www.example.com;

    # SSL Certificates
    ssl_certificate /etc/ssl/certs/example.com.crt;
    ssl_certificate_key /etc/ssl/private/example.com.key;
    ssl_trusted_certificate /etc/ssl/certs/ca-bundle.crt;

    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4;

    # Logging
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # API Routing
    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # API specific timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Static Content
    location /static/ {
        proxy_pass http://static_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        # Cache static content
        proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=static_cache:10m max_size=1g inactive=60m;
        proxy_cache static_cache;
        proxy_cache_valid 200 60m;
        proxy_cache_key "$scheme$request_method$host$request_uri";

        # Cache headers
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Root location (main application)
    location / {
        proxy_pass http://web_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;

        # Timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoint
    location /health {
        access_log off;
        proxy_pass http://web_backend;
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
    }
}

# API Subdomain
server {
    listen 443 ssl http2;
    server_name api.example.com;

    ssl_certificate /etc/ssl/certs/api.example.com.crt;
    ssl_certificate_key /etc/ssl/private/api.example.com.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    location / {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Rate limiting
        limit_req zone=api_limit burst=20 nodelay;
        limit_conn_status 429;
    }
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;

# Connection limiting
limit_conn_zone $binary_remote_addr zone=addr:10m;
limit_conn addr 10;
