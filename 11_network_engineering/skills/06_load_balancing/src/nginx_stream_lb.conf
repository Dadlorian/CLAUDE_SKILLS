# NGINX Stream (L4) Load Balancing Configuration
# TCP/UDP Load Balancing for Database and Cache Services
# Last Updated: 2025-11-19

# Enable stream module
stream {
    # Upstream definitions for TCP services

    upstream mysql_backend {
        least_conn;

        server db1.example.com:3306 weight=1 max_fails=2 fail_timeout=30s;
        server db2.example.com:3306 weight=1 max_fails=2 fail_timeout=30s;
        server db3.example.com:3306 weight=1 max_fails=2 fail_timeout=30s;
    }

    upstream postgresql_backend {
        least_conn;

        server pg1.example.com:5432 max_fails=2 fail_timeout=30s;
        server pg2.example.com:5432 max_fails=2 fail_timeout=30s;
    }

    upstream redis_backend {
        # Round robin for stateless cache
        server cache1.example.com:6379;
        server cache2.example.com:6379;
        server cache3.example.com:6379;
    }

    upstream rabbitmq_backend {
        least_conn;

        server mq1.example.com:5672 max_fails=2 fail_timeout=30s;
        server mq2.example.com:5672 max_fails=2 fail_timeout=30s;
        server mq3.example.com:5672 max_fails=2 fail_timeout=30s;
    }

    upstream elasticsearch_backend {
        # Hash on source IP for connection persistence
        hash $remote_addr consistent;

        server es1.example.com:9300 max_fails=2 fail_timeout=30s;
        server es2.example.com:9300 max_fails=2 fail_timeout=30s;
        server es3.example.com:9300 max_fails=2 fail_timeout=30s;
    }

    # Upstream zone for monitoring (NGINX Plus)
    upstream_zone backend_zone 64k;

    # MySQL Load Balancing
    server {
        listen 3306;
        proxy_pass mysql_backend;

        # TCP/MySQL specific settings
        proxy_connect_timeout 5s;
        proxy_timeout 300s;
        proxy_socket_keepalive on;

        # Logging
        access_log /var/log/nginx/mysql_access.log;
        error_log /var/log/nginx/mysql_error.log;

        # Health check (NGINX Plus)
        health_checks {
            interval 10s;
            failures 3;
            passes 2;
            timeout 5s;

            match mysql {
                expect_close;
            }
        }
    }

    # PostgreSQL Load Balancing
    server {
        listen 5432;
        proxy_pass postgresql_backend;

        proxy_connect_timeout 5s;
        proxy_timeout 300s;
        proxy_socket_keepalive on;

        access_log /var/log/nginx/postgresql_access.log;
        error_log /var/log/nginx/postgresql_error.log;

        health_checks {
            interval 10s;
            failures 3;
            passes 2;
            timeout 5s;

            match postgresql {
                expect_close;
            }
        }
    }

    # Redis Cache Load Balancing
    server {
        listen 6379;
        proxy_pass redis_backend;

        # Short timeouts for cache
        proxy_connect_timeout 3s;
        proxy_timeout 30s;
        proxy_socket_keepalive on;

        access_log /var/log/nginx/redis_access.log;

        health_checks {
            interval 5s;
            failures 2;
            passes 1;
            timeout 2s;

            match redis {
                send "PING\r\n";
                expect "PONG";
            }
        }
    }

    # RabbitMQ Load Balancing
    server {
        listen 5672;
        proxy_pass rabbitmq_backend;

        proxy_connect_timeout 5s;
        proxy_timeout 60s;
        proxy_socket_keepalive on;

        access_log /var/log/nginx/rabbitmq_access.log;
        error_log /var/log/nginx/rabbitmq_error.log;

        health_checks {
            interval 10s;
            failures 3;
            passes 2;
            timeout 5s;

            match rabbitmq {
                expect_close;
            }
        }
    }

    # Elasticsearch Load Balancing
    server {
        listen 9300;
        proxy_pass elasticsearch_backend;

        proxy_connect_timeout 5s;
        proxy_timeout 60s;
        proxy_socket_keepalive on;

        access_log /var/log/nginx/elasticsearch_access.log;
        error_log /var/log/nginx/elasticsearch_error.log;

        health_checks {
            interval 10s;
            failures 2;
            passes 2;
            timeout 5s;

            match elasticsearch {
                expect_close;
            }
        }
    }

    # Stats endpoint for monitoring (NGINX Plus)
    server {
        listen 8080;
        listen [::]:8080;

        location /api {
            api;
            access_log off;
        }

        location = /api/stream/upstreams {
            api;
            access_log off;
        }
    }

    # Default match for health checks
    match default {
        expect_close;
    }

    # TCP Connection settings (global)
    proxy_connect_timeout 5s;
    proxy_timeout 300s;
    proxy_protocol on;  # Enable HAProxy PROXY protocol if needed
    proxy_socket_keepalive on;

    # Logging format for stream
    log_format stream_format '$remote_addr - [$time_local] '
                           '"$protocol" $status $bytes_sent $bytes_received '
                           '$session_time';
    access_log /var/log/nginx/stream_access.log stream_format;
}
