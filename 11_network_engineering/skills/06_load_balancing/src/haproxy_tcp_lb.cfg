# HAProxy TCP Load Balancing Configuration
# Database and Cache Service Load Balancing
# Last Updated: 2025-11-19

global
    log 127.0.0.1 local0 notice
    stats socket /run/haproxy/admin.sock mode 660 level admin
    user haproxy
    group haproxy
    daemon
    maxconn 100000

defaults
    log     global
    mode    tcp
    option  tcplog
    timeout connect 5000
    timeout client  300000
    timeout server  300000
    timeout check   5000

#-----------
# Frontend: MySQL
#-----------
frontend mysql_in
    bind 0.0.0.0:3306
    default_backend mysql_backend
    mode tcp
    timeout client 300000

    # Accept MySQL traffic
    option tcplog

#-----------
# Backend: MySQL Replication
#-----------
backend mysql_backend
    mode tcp
    balance source  # IP hash for connection affinity

    # TCP connection check
    option tcp-check
    tcp-check connect port 3306

    # Timeout settings
    timeout server 300000
    timeout connect 5000

    # MySQL servers
    server mysql-primary 192.168.1.30:3306 check inter 10000 rise 2 fall 2
    server mysql-replica1 192.168.1.31:3306 check inter 10000 rise 2 fall 2
    server mysql-replica2 192.168.1.32:3306 check inter 10000 rise 2 fall 2

    # Minimum servers required
    default-server inter 10000 rise 2 fall 2

#-----------
# Frontend: PostgreSQL
#-----------
frontend postgresql_in
    bind 0.0.0.0:5432
    default_backend postgresql_backend
    mode tcp
    timeout client 300000

#-----------
# Backend: PostgreSQL
#-----------
backend postgresql_backend
    mode tcp
    balance leastconn

    # TCP connection check
    option tcp-check
    tcp-check connect port 5432

    timeout server 300000
    timeout connect 5000

    # PostgreSQL servers
    server pg-primary 192.168.1.35:5432 check inter 10000 rise 2 fall 2
    server pg-replica 192.168.1.36:5432 check inter 10000 rise 2 fall 2

#-----------
# Frontend: Redis Cache
#-----------
frontend redis_in
    bind 0.0.0.0:6379
    default_backend redis_backend
    mode tcp
    timeout client 30000

#-----------
# Backend: Redis Cluster
#-----------
backend redis_backend
    mode tcp
    balance leastconn

    # Redis PING health check
    option tcp-check
    tcp-check connect port 6379
    tcp-check send "PING\r\n"
    tcp-check expect string "PONG"

    timeout server 30000
    timeout connect 3000

    # Redis cluster nodes
    server redis1 192.168.1.40:6379 check inter 5000 rise 1 fall 2
    server redis2 192.168.1.41:6379 check inter 5000 rise 1 fall 2
    server redis3 192.168.1.42:6379 check inter 5000 rise 1 fall 2

#-----------
# Frontend: RabbitMQ Management
#-----------
frontend rabbitmq_in
    bind 0.0.0.0:5672
    default_backend rabbitmq_backend
    mode tcp
    timeout client 60000

#-----------
# Backend: RabbitMQ Cluster
#-----------
backend rabbitmq_backend
    mode tcp
    balance roundrobin

    # TCP connection check
    option tcp-check
    tcp-check connect port 5672

    timeout server 60000
    timeout connect 5000

    # RabbitMQ cluster nodes
    server rabbit1 192.168.1.80:5672 check inter 10000 rise 2 fall 2 weight 1
    server rabbit2 192.168.1.81:5672 check inter 10000 rise 2 fall 2 weight 1
    server rabbit3 192.168.1.82:5672 check inter 10000 rise 2 fall 2 weight 1

#-----------
# Frontend: Elasticsearch
#-----------
frontend elasticsearch_in
    bind 0.0.0.0:9300
    default_backend elasticsearch_backend
    mode tcp
    timeout client 60000

#-----------
# Backend: Elasticsearch Cluster
#-----------
backend elasticsearch_backend
    mode tcp
    balance leastconn

    option tcp-check
    tcp-check connect port 9300

    timeout server 60000
    timeout connect 5000

    # Elasticsearch nodes
    server es1 192.168.1.100:9300 check inter 10000 rise 2 fall 2
    server es2 192.168.1.101:9300 check inter 10000 rise 2 fall 2
    server es3 192.168.1.102:9300 check inter 10000 rise 2 fall 2

#-----------
# Frontend: Statistics Page
#-----------
frontend stats
    bind 0.0.0.0:8404
    stats enable
    stats uri /stats
    stats refresh 30s
    stats admin if TRUE
    mode http
    timeout client 5000
