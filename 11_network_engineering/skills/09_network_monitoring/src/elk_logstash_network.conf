input {
  udp {
    host => "0.0.0.0"
    port => 514
    codec => plain
    type => "syslog"
  }
  tcp {
    host => "0.0.0.0"
    port => 514
    codec => plain
    type => "syslog"
  }
}

filter {
  if [type] == "syslog" {
    grok {
      match => { "message" => "%{SYSLOGLINE}" }
    }
    
    date {
      match => [ "timestamp", "MMM d HH:mm:ss", "MMM dd HH:mm:ss" ]
    }
    
    if [message] =~ /LINK-3-UPDOWN/ {
      mutate { add_tag => [ "interface_change" ] }
    }
    if [message] =~ /BGP.*down/ {
      mutate { add_tag => [ "bgp_change" ] }
    }
  }
}

output {
  elasticsearch {
    hosts => ["localhost:9200"]
    index => "network-logs-%{+YYYY.MM.dd}"
  }
}
