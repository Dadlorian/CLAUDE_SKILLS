# Prometheus Configuration for Network Monitoring

global:
  scrape_interval: 2m
  evaluation_interval: 1m
  external_labels:
    monitor: 'network-monitoring'
    site: 'primary'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - localhost:9093
            - alertmanager-02.example.com:9093
      path_prefix: /alertmanager

# Load rules for alerting and recording
rule_files:
  - '/etc/prometheus/rules/*.yml'
  - '/etc/prometheus/rules/network_*.yml'

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    scrape_interval: 30s
    static_configs:
      - targets: ['localhost:9090']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'prometheus-01'

  # SNMP Exporter
  - job_name: 'snmp_routers'
    static_configs:
      - targets:
          - 192.168.1.1
          - 192.168.1.2
          - 192.168.1.3
        labels:
          site: 'datacenter'
          type: 'router'
      - targets:
          - 192.168.1.10
          - 192.168.1.11
        labels:
          site: 'branch'
          type: 'router'
    metrics_path: /snmp
    params:
      module: [if_mib]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: localhost:9116
    scrape_interval: 2m
    scrape_timeout: 30s

  # SNMP Switches
  - job_name: 'snmp_switches'
    static_configs:
      - targets:
          - 10.0.1.1
          - 10.0.1.2
        labels:
          site: 'datacenter'
          type: 'switch'
    metrics_path: /snmp
    params:
      module: [if_mib]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: localhost:9116
    scrape_interval: 2m

  # Node Exporter (server metrics)
  - job_name: 'node_exporter'
    static_configs:
      - targets:
          - 'prometheus-01:9100'
          - 'monitoring-02:9100'
          - 'collector-01:9100'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '([^:]+)(?::\d+)?'
        replacement: '${1}'

  # BlackBox Exporter (endpoint monitoring)
  - job_name: 'blackbox'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://webserver.example.com:80
          - https://api.example.com:443
          - http://monitoring.example.com:3000
        labels:
          type: 'http'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: localhost:9115

  # File-based service discovery
  - job_name: 'file_sd'
    file_sd_configs:
      - files:
          - '/etc/prometheus/targets/*.json'
          - '/etc/prometheus/targets/*.yml'
        refresh_interval: 5m
    relabel_configs:
      - source_labels: [__meta_label_job]
        target_label: job
      - source_labels: [__meta_label_site]
        target_label: site
      - source_labels: [__meta_label_type]
        target_label: type

  # Consul Service Discovery
  - job_name: 'consul'
    consul_sd_configs:
      - server: 'localhost:8500'
        datacenter: 'dc1'
        services: ['monitoring', 'network']
    relabel_configs:
      - source_labels: [__meta_consul_service]
        target_label: service
      - source_labels: [__meta_consul_node]
        target_label: node

# Remote storage configuration (optional)
# remote_write:
#   - url: http://remote-storage.example.com:9009/api/v1/write
#     queue_config:
#       max_samples_per_send: 1000
#       max_retries: 5
#       min_backoff: 30ms
#       max_backoff: 1s

# Storage configuration
storage:
  tsdb:
    path: /var/lib/prometheus
    retention:
      size: '500GB'
      time: 30d

---

## Related Configuration Files

### Recording Rules (/etc/prometheus/rules/network.yml)
groups:
  - name: network_aggregation
    interval: 30s
    rules:
      # Interface bandwidth utilization
      - record: network:interface_utilization_pct
        expr: |
          ((rate(ifInOctets[5m]) + rate(ifOutOctets[5m])) * 8 / ifSpeed) * 100

      # Per-device bandwidth
      - record: network:device_bandwidth_gbps
        expr: |
          sum by (instance) (rate(ifInOctets[5m]) + rate(ifOutOctets[5m])) * 8 / 1000000000

      # Interface error rate
      - record: network:interface_error_rate
        expr: |
          (rate(ifInErrors[5m]) + rate(ifOutErrors[5m])) /
          (rate(ifInPackets[5m]) + rate(ifOutPackets[5m]))

### Alert Rules (/etc/prometheus/rules/network_alerts.yml)
groups:
  - name: network_alerts
    rules:
      - alert: InterfaceDown
        expr: node_network_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Interface {{ $labels.interface }} is down"

      - alert: LinkSaturation
        expr: network:interface_utilization_pct > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Link {{ $labels.instance }} utilization >80%"

---

**Configuration Type**: Prometheus Scrape Configuration
**Version**: Prometheus 2.45+
**Purpose**: Network infrastructure monitoring
**Data Retention**: 30 days (configurable)
