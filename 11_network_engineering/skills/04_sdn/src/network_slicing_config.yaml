---
network_slicing:
  description: "Network Slicing Configuration for Multi-Tenant Networks"
  
  slices:
    - slice_id: 1
      name: "Enhanced-Mobile-Broadband"
      sla:
        latency_ms: 50
        bandwidth_guarantee_gbps: 10
        availability_percent: 99.9
      resources:
        spectrum: ["band-1", "band-7"]
        network_functions: ["RAN", "5GC"]
      isolation: "strict"
      
    - slice_id: 2
      name: "Industrial-IoT"
      sla:
        latency_ms: 10
        bandwidth_guarantee_mbps: 100
        availability_percent: 99.99
        packet_loss_percent: 0.001
      resources:
        spectrum: ["band-78"]
        network_functions: ["MEC", "5GC"]
      isolation: "ultra-strict"
      
    - slice_id: 3
      name: "Smart-City"
      sla:
        latency_ms: 100
        bandwidth_guarantee_mbps: 50
        availability_percent: 99
      resources:
        spectrum: ["band-3"]
        network_functions: ["5GC", "Analytics"]
      isolation: "normal"

  orchestration:
    - action: "create_slice"
      trigger: "on-demand"
      duration_hours: 24
      
    - action: "modify_resources"
      trigger: "sla_violation"
      scale_factor: 1.5
      
    - action: "terminate_slice"
      trigger: "end_of_contract"
      graceful_shutdown: true

  monitoring:
    - metric: "slice_utilization"
      target: 70%
      
    - metric: "latency"
      target: "within_sla"
      
    - metric: "isolation_breach"
      target: 0
      alert: "critical"

  management_plane:
    api: "3GPP-SA6-REST"
    encryption: "TLS-1.3"
    authentication: "OAuth-2.0"
