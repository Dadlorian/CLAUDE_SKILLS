# GitLab CI/CD Pipeline for Network Automation
# Validates, tests, and deploys network configurations

image: ansible:latest

variables:
  ANSIBLE_HOST_KEY_CHECKING: "False"
  PYTHONUNBUFFERED: "1"
  TERRAFORM_VERSION: "1.5.0"

stages:
  - validate
  - test
  - deploy_staging
  - approval
  - deploy_production
  - verify

before_script:
  - pip install --upgrade pip
  - pip install -r requirements.txt
  - ansible --version

# =====================
# VALIDATION STAGE
# =====================

validate_ansible:
  stage: validate
  script:
    - echo "Validating Ansible playbooks and roles..."
    - ansible-lint ansible/ || true
    - yamllint ansible/ || true
    - for playbook in ansible/playbooks/*.yaml; do
        ansible-playbook "$playbook" --syntax-check;
      done
  artifacts:
    reports:
      sast: lint-report.json
    expire_in: 1 day
  allow_failure: true

validate_terraform:
  stage: validate
  image: hashicorp/terraform:latest
  script:
    - echo "Validating Terraform configurations..."
    - terraform -chdir=terraform validate
    - terraform -chdir=terraform fmt -check -recursive
  allow_failure: false

validate_python:
  stage: validate
  script:
    - echo "Validating Python scripts..."
    - python -m py_compile python/scripts/*.py
    - pylint python/scripts/ --exit-zero
  allow_failure: true

# =====================
# TEST STAGE
# =====================

unit_tests:
  stage: test
  script:
    - echo "Running unit tests..."
    - pip install pytest pytest-cov
    - pytest tests/unit -v --cov=python --cov-report=xml
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
      junit: test-results.xml
    expire_in: 30 days
  coverage: '/TOTAL.*\s+(\d+%)$/'

test_lab_deployment:
  stage: test
  script:
    - echo "Deploying to lab environment..."
    - ansible-playbook -i inventory/lab playbooks/deploy_config.yaml --check
    - echo "✓ Lab deployment validation successful"
  environment:
    name: lab
  only:
    - merge_requests

# =====================
# STAGING DEPLOYMENT
# =====================

deploy_staging:
  stage: deploy_staging
  script:
    - echo "Deploying to staging environment..."
    - ansible-playbook -i inventory/staging playbooks/deploy_config.yaml
    - echo "✓ Staging deployment completed"
  environment:
    name: staging
    url: https://staging.example.com
  when: manual
  only:
    - develop
  artifacts:
    paths:
      - deployment_logs/
    expire_in: 7 days

# =====================
# STAGING VERIFICATION
# =====================

verify_staging:
  stage: verify
  script:
    - echo "Running staging verification tests..."
    - pip install napalm netmiko
    - python tests/staging_validation.py
  environment:
    name: staging
  when: on_success
  dependencies:
    - deploy_staging
  only:
    - develop

# =====================
# PRODUCTION APPROVAL
# =====================

approve_production:
  stage: approval
  script:
    - echo "Production deployment ready for approval"
    - echo "Commit: $CI_COMMIT_SHA"
    - echo "Branch: $CI_COMMIT_REF_NAME"
  when: manual
  only:
    - main

# =====================
# PRODUCTION DEPLOYMENT
# =====================

deploy_production:
  stage: deploy_production
  script:
    - echo "PRODUCTION DEPLOYMENT"
    - echo "========================"
    - echo "Running pre-deployment checks..."
    - python scripts/pre_deployment_checks.py

    - echo ""
    - echo "Deploying to production..."
    - ansible-playbook -i inventory/prod playbooks/pre_deployment_validation.yaml
    - ansible-playbook -i inventory/prod playbooks/deploy_config.yaml

    - echo ""
    - echo "Running post-deployment checks..."
    - python scripts/post_deployment_validation.py
    - echo "✓ Production deployment completed"
  environment:
    name: production
    url: https://prod.example.com
  when: manual
  only:
    - main
  artifacts:
    paths:
      - deployment_logs/
      - compliance_reports/
    expire_in: 30 days

# =====================
# ROLLBACK
# =====================

rollback_production:
  stage: deploy_production
  script:
    - echo "Rolling back production configuration..."
    - ansible-playbook -i inventory/prod playbooks/rollback.yaml
    - echo "✓ Rollback completed"
  environment:
    name: production
    action: rollback
  when: manual
  only:
    - main

# =====================
# NOTIFICATIONS
# =====================

notify_success:
  stage: .post
  script:
    - echo "Pipeline completed successfully"
    - |
      if [ "$CI_ENVIRONMENT_NAME" = "production" ]; then
        curl -X POST https://slack.example.com/webhook \
          -d '{"text":"Production deployment successful - '$CI_COMMIT_SHA'"}'
      fi
  when: on_success
  only:
    - main

notify_failure:
  stage: .post
  script:
    - echo "Pipeline failed"
    - |
      curl -X POST https://slack.example.com/webhook \
        -d '{"text":"Pipeline failed in '$CI_JOB_NAME' - '$CI_COMMIT_SHA'"}'
  when: on_failure
