# Kubernetes Secrets Examples
#
# Secrets store sensitive information such as passwords, tokens, and keys.
# Data in Secrets is base64-encoded (NOT encrypted by default).
#
# Security Best Practices:
# - Enable encryption at rest in etcd
# - Use RBAC to restrict access
# - Consider external secret management (Vault, AWS Secrets Manager, etc.)
# - Rotate secrets regularly
# - Use immutable secrets when possible

---
# Opaque Secret (Generic)
# Most common type for arbitrary key-value pairs
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: production
  labels:
    app: web-application
type: Opaque
data:
  # Base64 encoded values (use: echo -n 'value' | base64)
  database-password: cGFzc3dvcmQxMjM=  # password123
  api-key: YXBpLWtleS0xMjM0NTY3ODkw      # api-key-1234567890
  secret-token: c2VjcmV0LXRva2VuLXh5ei1hYmM=  # secret-token-xyz-abc

# Alternative: Use stringData for automatic base64 encoding
stringData:
  database-username: "app_user"
  redis-password: "redis_pass_123"

---
# Docker Registry Secret
# Used to pull images from private registries
apiVersion: v1
kind: Secret
metadata:
  name: registry-credentials
  namespace: production
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: eyJhdXRocyI6eyJteXJlZ2lzdHJ5LmF6dXJlY3IuaW8iOnsidXNlcm5hbWUiOiJ1c2VyIiwicGFzc3dvcmQiOiJwYXNzIiwiZW1haWwiOiJlbWFpbEBleGFtcGxlLmNvbSIsImF1dGgiOiJkWE5sY2pwd1lYTnoifX19

# Create with kubectl:
# kubectl create secret docker-registry registry-credentials \
#   --docker-server=myregistry.azurecr.io \
#   --docker-username=username \
#   --docker-password=password \
#   --docker-email=email@example.com \
#   --namespace=production

---
# TLS Secret
# Stores TLS certificates and private keys
apiVersion: v1
kind: Secret
metadata:
  name: tls-certificate
  namespace: production
type: kubernetes.io/tls
data:
  tls.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0t...  # Base64 encoded certificate
  tls.key: LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0t...  # Base64 encoded private key

# Create with kubectl:
# kubectl create secret tls tls-certificate \
#   --cert=path/to/tls.crt \
#   --key=path/to/tls.key \
#   --namespace=production

---
# Basic Authentication Secret
# Used for basic auth in ingress
apiVersion: v1
kind: Secret
metadata:
  name: basic-auth
  namespace: production
type: kubernetes.io/basic-auth
stringData:
  username: admin
  password: supersecret123

---
# SSH Authentication Secret
apiVersion: v1
kind: Secret
metadata:
  name: ssh-key
  namespace: production
type: kubernetes.io/ssh-auth
data:
  ssh-privatekey: LS0tLS1CRUdJTiBPUEVOU1NIIFBSSVZBVEUgS0VZLS0tLS0...  # Base64 encoded SSH private key

---
# Service Account Token Secret
apiVersion: v1
kind: Secret
metadata:
  name: service-account-token
  namespace: production
  annotations:
    kubernetes.io/service-account.name: "app-service-account"
type: kubernetes.io/service-account-token

---
# Bootstrap Token Secret (for cluster bootstrapping)
apiVersion: v1
kind: Secret
metadata:
  name: bootstrap-token-abc123
  namespace: kube-system
type: bootstrap.kubernetes.io/token
stringData:
  token-id: abc123
  token-secret: 0123456789abcdef
  usage-bootstrap-authentication: "true"
  usage-bootstrap-signing: "true"
  expiration: "2024-12-31T23:59:59Z"

---
# Database Credentials Secret
apiVersion: v1
kind: Secret
metadata:
  name: database-credentials
  namespace: production
  labels:
    app: postgres
type: Opaque
stringData:
  # PostgreSQL
  postgres-user: "app_user"
  postgres-password: "SuperSecurePassword123!"
  postgres-db: "production_db"

  # Connection string
  connection-string: "postgresql://app_user:SuperSecurePassword123!@postgres.production.svc.cluster.local:5432/production_db"

  # JDBC URL (for Java apps)
  jdbc-url: "jdbc:postgresql://postgres.production.svc.cluster.local:5432/production_db?user=app_user&password=SuperSecurePassword123!"

---
# Redis Credentials Secret
apiVersion: v1
