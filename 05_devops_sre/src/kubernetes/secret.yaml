---
# Immutable Secret (Best Practice)
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets-v1.0.0
  namespace: production
  labels:
    version: v1.0.0
type: Opaque
immutable: true  # Prevents modification
stringData:
  api-key: "immutable-api-key-123"
  version: "1.0.0"

---
# External Secrets Operator Example
# Syncs secrets from external secret managers
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: aws-secrets
  namespace: production
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: app-secrets-from-aws
    creationPolicy: Owner
  data:
  - secretKey: database-password
    remoteRef:
      key: prod/database/password
  - secretKey: api-key
    remoteRef:
      key: prod/api/key

---
# SecretStore for External Secrets Operator (AWS)
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: production
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-west-2
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa

---
# Sealed Secret (Bitnami Sealed Secrets)
# Encrypted secret that can be stored in Git
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: sealed-app-secrets
  namespace: production
spec:
  encryptedData:
    database-password: AgA1234567890abcdef...  # Encrypted with cluster public key
    api-key: AgA0987654321fedcba...

---
# Using Secrets in Pods - Reference Examples

# Example 1: Environment variables from Secret
# spec:
#   containers:
#   - name: app
#     envFrom:
#     - secretRef:
#         name: app-secrets

# Example 2: Specific keys as environment variables
# spec:
#   containers:
#   - name: app
#     env:
#     - name: DATABASE_PASSWORD
#       valueFrom:
#         secretKeyRef:
#           name: database-credentials
#           key: postgres-password

# Example 3: Mount Secret as volume (files)
# spec:
#   containers:
#   - name: app
#     volumeMounts:
#     - name: secrets
#       mountPath: /etc/secrets
#       readOnly: true
#   volumes:
#   - name: secrets
#     secret:
#       secretName: app-secrets
#       defaultMode: 0400  # Read-only for owner

# Example 4: Mount specific keys as files
# spec:
#   volumes:
#   - name: tls
#     secret:
#       secretName: tls-certificate
#       items:
#       - key: tls.crt
#         path: server.crt
#       - key: tls.key
#         path: server.key
#         mode: 0400

# Example 5: ImagePullSecrets for private registries
# spec:
#   imagePullSecrets:
#   - name: registry-credentials

---
# Best Practices and Security Notes:
#
# 1. Creating Secrets:
#    kubectl create secret generic app-secrets \
#      --from-literal=key1=value1 \
#      --from-file=ssh-key=~/.ssh/id_rsa \
#      --namespace=production
#
# 2. Viewing Secrets (requires permissions):
#    kubectl get secret app-secrets -o yaml
#    kubectl get secret app-secrets -o jsonpath='{.data.database-password}' | base64 -d
#
# 3. Encryption at Rest:
#    - Enable in kube-apiserver: --encryption-provider-config
#    - Use EncryptionConfiguration
#
# 4. External Secret Management:
#    - HashiCorp Vault
#    - AWS Secrets Manager
#    - Azure Key Vault
#    - GCP Secret Manager
#    - External Secrets Operator
#    - Sealed Secrets
#
# 5. RBAC for Secrets:
#    - Restrict get/list/watch on secrets
#    - Use separate namespaces
#    - Service accounts with minimal permissions
#
# 6. Secret Rotation:
#    - Use immutable secrets with versioning
#    - Update references in deployments
#    - Automate with external secret operators
#
# 7. Avoid:
#    - Storing secrets in ConfigMaps
#    - Committing secrets to Git (use Sealed Secrets if needed)
#    - Logging secret values
#    - Passing secrets via command-line arguments
