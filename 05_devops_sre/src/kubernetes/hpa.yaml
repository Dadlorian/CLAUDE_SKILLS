# Horizontal Pod Autoscaler (HPA) Examples
#
# HPA automatically scales the number of pods based on observed metrics.
# Requires metrics-server to be installed in the cluster.

---
# Basic HPA with CPU and Memory Metrics
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web-application-hpa
  namespace: production
  labels:
    app: web-application
spec:
  # Target deployment to scale
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web-application

  # Replica bounds
  minReplicas: 3
  maxReplicas: 20

  # Metrics to monitor
  metrics:
  # CPU utilization
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70  # Target 70% CPU usage

  # Memory utilization
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80  # Target 80% memory usage

  # Scaling behavior configuration
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # Wait 5 minutes before scaling down
      policies:
      - type: Percent
        value: 50  # Remove up to 50% of current pods
        periodSeconds: 60
      - type: Pods
        value: 2  # Remove at most 2 pods
        periodSeconds: 60
      selectPolicy: Min  # Choose most conservative policy

    scaleUp:
      stabilizationWindowSeconds: 0  # Scale up immediately
      policies:
      - type: Percent
        value: 100  # Can double pod count
        periodSeconds: 15
      - type: Pods
        value: 4  # Add at most 4 pods at a time
        periodSeconds: 15
      selectPolicy: Max  # Choose most aggressive policy

---
# Advanced HPA with Custom Metrics (Prometheus)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-service-hpa
  namespace: production
  labels:
    app: api-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-service

  minReplicas: 5
  maxReplicas: 50

  metrics:
  # CPU metric
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75

  # Memory metric
  - type: Resource
    resource:
      name: memory
      target:
        type: AverageValue
        averageValue: 1500Mi  # Absolute value instead of percentage

  # Custom metric: HTTP requests per second (per pod)
  - type: Pods
    pods:
      metric:
        name: http_requests_per_second
      target:
        type: AverageValue
        averageValue: "1000"  # 1000 requests/second per pod

  # Custom metric: Queue depth
  - type: Pods
    pods:
      metric:
        name: queue_depth
      target:
        type: AverageValue
        averageValue: "100"  # 100 messages in queue per pod

  # External metric (from external system like AWS CloudWatch)
  - type: External
    external:
      metric:
        name: sqs_queue_messages_ready
        selector:
          matchLabels:
            queue_name: "production-jobs"
      target:
        type: AverageValue
        averageValue: "30"  # 30 messages per pod

  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600  # 10 minutes
      policies:
      - type: Percent
        value: 25  # Scale down by 25% max
        periodSeconds: 120
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
      - type: Percent
        value: 50  # Scale up by 50% max
        periodSeconds: 30

---
# HPA for Batch Processing Workloads
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: batch-processor-hpa
  namespace: production
  labels:
    app: batch-processor
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: batch-processor

  minReplicas: 1
  maxReplicas: 100

  metrics:
  # Scale based on custom metric: pending jobs
  - type: External
    external:
      metric:
        name: pending_jobs_count
        selector:
          matchLabels:
            job_type: "data_processing"
      target:
        type: Value
        value: "1000"  # Add 1 pod for every 1000 pending jobs

  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 100  # Can scale down aggressively
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100  # Can scale up aggressively
        periodSeconds: 30
      - type: Pods
        value: 10  # Add up to 10 pods at once
        periodSeconds: 30

---
# HPA with Object Metric (Ingress QPS)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend-hpa
  namespace: production
  labels:
    app: frontend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend

  minReplicas: 2
  maxReplicas: 30

  metrics:
  # CPU baseline
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60

  # Scale based on Ingress requests per second
  - type: Object
    object:
      metric:
        name: requests_per_second
      describedObject:
        apiVersion: networking.k8s.io/v1
        kind: Ingress
        name: frontend-ingress
      target:
        type: Value
        value: "10k"  # 10,000 RPS total

  behavior:
    scaleDown:
      stabilizationWindowSeconds: 180
      policies:
      - type: Pods
        value: 1
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Pods
        value: 2
        periodSeconds: 30

---
# HPA for Cron Jobs / Scheduled Tasks
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: scheduled-task-hpa
  namespace: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: scheduled-tasks

  minReplicas: 0  # Can scale to zero during off-hours
  maxReplicas: 20

  metrics:
  - type: Pods
    pods:
      metric:
        name: active_tasks
      target:
        type: AverageValue
        averageValue: "5"  # 5 active tasks per pod

  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 200
        periodSeconds: 15

---
# HPA with ContainerResource Metric (for multi-container pods)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: multi-container-hpa
  namespace: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: multi-container-app

  minReplicas: 2
  maxReplicas: 15

  metrics:
  # Scale based on specific container's CPU usage
  - type: ContainerResource
    containerResource:
      name: cpu
      container: main-app  # Specific container name
      target:
        type: Utilization
        averageUtilization: 70

  # Scale based on another container's memory
  - type: ContainerResource
    containerResource:
      name: memory
      container: sidecar-proxy
      target:
        type: Utilization
        averageUtilization: 80

---
# HPA for Serverless-Style Scaling (KEDA Alternative)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: event-driven-hpa
  namespace: production
  labels:
    app: event-processor
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: event-processor

  minReplicas: 0  # Scale to zero when no events
  maxReplicas: 100

  metrics:
  # External metric from message queue
  - type: External
    external:
      metric:
        name: kafka_consumer_lag
        selector:
          matchLabels:
            topic: "events"
            consumer_group: "processors"
      target:
        type: AverageValue
        averageValue: "1000"  # 1000 messages lag per pod

  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 5
        periodSeconds: 15

---
# HPA with Multiple Resource Targets
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: database-worker-hpa
  namespace: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: database-worker

  minReplicas: 3
  maxReplicas: 25

  metrics:
  # CPU
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80

  # Memory as absolute value
  - type: Resource
    resource:
      name: memory
      target:
        type: AverageValue
        averageValue: 2Gi

  # Database connection pool usage (custom metric)
  - type: Pods
    pods:
      metric:
        name: db_connection_pool_usage
      target:
        type: AverageValue
        averageValue: "80"  # 80% pool usage

  # Active database queries
  - type: Pods
    pods:
      metric:
        name: active_db_queries
      target:
        type: AverageValue
        averageValue: "50"  # 50 active queries per pod

  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600  # 10 min - be conservative with DB workers
      policies:
      - type: Pods
        value: 1  # Remove one pod at a time
        periodSeconds: 120
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Pods
        value: 2  # Add two pods at a time
        periodSeconds: 30

---
# Notes for setting up custom metrics:
#
# 1. Install Prometheus Adapter:
#    helm install prometheus-adapter prometheus-community/prometheus-adapter
#
# 2. Configure custom metrics in prometheus-adapter values:
#    rules:
#    - seriesQuery: 'http_requests_total{namespace="production"}'
#      resources:
#        overrides:
#          namespace: {resource: "namespace"}
#          pod: {resource: "pod"}
#      name:
#        matches: "^(.*)_total"
#        as: "${1}_per_second"
#      metricsQuery: 'sum(rate(<<.Series>>{<<.LabelMatchers>>}[2m])) by (<<.GroupBy>>)'
#
# 3. Verify custom metrics are available:
#    kubectl get --raw "/apis/custom.metrics.k8s.io/v1beta1" | jq .
#
# 4. Test HPA:
#    kubectl describe hpa <hpa-name> -n production
#    kubectl get hpa -w
