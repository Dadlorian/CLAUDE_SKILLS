# Pod Disruption Budget (PDB) Examples
#
# PDBs ensure application availability during voluntary disruptions
# such as node drains, cluster upgrades, or manual pod evictions.
#
# Voluntary disruptions include:
# - Node maintenance (kubectl drain)
# - Cluster upgrades
# - Cluster autoscaler scale-down
# - Manual pod deletions
#
# Involuntary disruptions (NOT protected by PDB):
# - Hardware failures
# - Kernel panics
# - Network partitions
# - Node out of resources

---
# Basic PDB with minAvailable
# Ensures at least 2 pods are always available
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web-application-pdb
  namespace: production
  labels:
    app: web-application
spec:
  minAvailable: 2  # Minimum pods that must remain available
  selector:
    matchLabels:
      app: web-application
      tier: frontend

---
# PDB with maxUnavailable
# Allows at most 1 pod to be unavailable at a time
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-service-pdb
  namespace: production
  labels:
    app: api-service
spec:
  maxUnavailable: 1  # Maximum pods that can be unavailable
  selector:
    matchLabels:
      app: api-service

---
# PDB with Percentage (minAvailable)
# Ensures 80% of pods remain available during disruptions
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend-pdb-percentage
  namespace: production
  labels:
    app: backend
spec:
  minAvailable: 80%  # Percentage of pods that must be available
  selector:
    matchLabels:
      app: backend
      tier: backend

---
# PDB with Percentage (maxUnavailable)
# Allows at most 25% of pods to be unavailable
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cache-pdb
  namespace: production
  labels:
    app: redis-cache
spec:
  maxUnavailable: 25%
  selector:
    matchLabels:
      app: redis-cache

---
# Strict PDB for Critical Services
# Requires ALL pods to be available (maxUnavailable: 0)
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: critical-service-pdb
  namespace: production
  labels:
    app: critical-payment-service
    criticality: high
spec:
  maxUnavailable: 0  # No voluntary disruptions allowed
  selector:
    matchLabels:
      app: critical-payment-service

---
# PDB for Highly Available Database (StatefulSet)
# Ensures quorum is maintained for distributed databases
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: postgres-pdb
  namespace: production
  labels:
    app: postgres
spec:
  minAvailable: 2  # Keep quorum (2 out of 3 replicas)
  selector:
    matchLabels:
      app: postgres
      component: database

---
# PDB for Elasticsearch Cluster
# Maintains cluster stability during rolling updates
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: elasticsearch-master-pdb
  namespace: production
  labels:
    app: elasticsearch
    role: master
spec:
  minAvailable: 2  # Maintain quorum for master nodes
  selector:
    matchLabels:
      app: elasticsearch
      role: master

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: elasticsearch-data-pdb
  namespace: production
  labels:
    app: elasticsearch
    role: data
spec:
  maxUnavailable: 1  # Only one data node down at a time
  selector:
    matchLabels:
      app: elasticsearch
      role: data

---
# PDB for Kafka Cluster
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kafka-pdb
  namespace: production
  labels:
    app: kafka
spec:
  minAvailable: 2  # Maintain quorum (assuming 3 brokers)
  selector:
    matchLabels:
      app: kafka

---
# PDB for ZooKeeper Ensemble
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: zookeeper-pdb
  namespace: production
  labels:
    app: zookeeper
spec:
  minAvailable: 2  # Maintain quorum (2N+1 rule, assuming 3 nodes)
  selector:
    matchLabels:
      app: zookeeper

---
# PDB for Batch Processing (Can tolerate disruptions)
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: batch-processor-pdb
  namespace: production
  labels:
    app: batch-processor
spec:
  minAvailable: 1  # Keep at least one worker running
  selector:
    matchLabels:
      app: batch-processor
      workload: batch

---
# PDB for Canary Deployment
# Protects stable version during canary rollout
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: app-stable-pdb
  namespace: production
  labels:
    app: web-app
    track: stable
spec:
  minAvailable: 3
  selector:
    matchLabels:
      app: web-app
      track: stable

---
# PDB for Multi-Zone Deployment
# Ensures at least one pod per zone remains available
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: multi-zone-app-pdb
  namespace: production
  labels:
    app: multi-zone-app
spec:
  minAvailable: 3  # One per zone (assuming 3 AZs)
  selector:
    matchLabels:
      app: multi-zone-app

---
# PDB for Development Environment (Lenient)
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: dev-app-pdb
  namespace: development
  labels:
    app: dev-application
spec:
  minAvailable: 0  # Allow all pods to be disrupted
  selector:
    matchLabels:
      app: dev-application

---
# PDB with Multiple Selectors (Advanced)
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: microservices-pdb
  namespace: production
  labels:
    tier: application
spec:
  maxUnavailable: 20%
  selector:
    matchExpressions:
    - key: tier
      operator: In
      values:
      - application
      - frontend
    - key: environment
      operator: In
      values:
      - production

---
# PDB for DaemonSet (Node Agents)
# Typically not needed, but shown for completeness
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: node-agent-pdb
  namespace: kube-system
  labels:
    app: node-agent
spec:
  maxUnavailable: 1  # Only disrupt one node at a time
  selector:
    matchLabels:
      app: node-agent

---
# PDB for Ingress Controllers
# Ensures traffic can always be routed
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ingress-nginx-pdb
  namespace: ingress-nginx
  labels:
    app.kubernetes.io/name: ingress-nginx
spec:
  minAvailable: 2  # At least 2 ingress pods available
  selector:
    matchLabels:
      app.kubernetes.io/name: ingress-nginx
      app.kubernetes.io/component: controller

---
# PDB for Prometheus (Monitoring)
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: prometheus-pdb
  namespace: monitoring
  labels:
    app: prometheus
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: prometheus

---
# PDB for Redis Cluster
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis-cluster-pdb
  namespace: production
  labels:
    app: redis-cluster
spec:
  minAvailable: 4  # Maintain quorum (assuming 6 nodes: 3 masters + 3 replicas)
  selector:
    matchLabels:
      app: redis-cluster

---
# PDB for RabbitMQ Cluster
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rabbitmq-pdb
  namespace: production
  labels:
    app: rabbitmq
spec:
  minAvailable: 2  # Maintain quorum (assuming 3-node cluster)
  selector:
    matchLabels:
      app: rabbitmq

---
# PDB for Consul Cluster
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: consul-pdb
  namespace: production
  labels:
    app: consul
spec:
  minAvailable: 3  # Maintain quorum (assuming 5-node cluster)
  selector:
    matchLabels:
      app: consul

---
# PDB for etcd Cluster
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: etcd-pdb
  namespace: kube-system
  labels:
    app: etcd
spec:
  minAvailable: 2  # Maintain quorum (assuming 3-node cluster)
  selector:
    matchLabels:
      component: etcd

---
# Notes and Best Practices:
#
# 1. Choosing minAvailable vs maxUnavailable:
#    - minAvailable: When you know exact minimum (e.g., quorum = 2)
#    - maxUnavailable: When scaling is dynamic (works with HPA)
#
# 2. For quorum-based systems (databases, consensus):
#    - 3 nodes: minAvailable: 2
#    - 5 nodes: minAvailable: 3
#    - 7 nodes: minAvailable: 4
#
# 3. For stateless applications:
#    - Use percentage: maxUnavailable: 25%
#    - Or absolute: maxUnavailable: 1 or 2
#
# 4. Testing PDBs:
#    kubectl drain <node> --ignore-daemonsets --delete-emptydir-data
#    kubectl get pdb -A -w
#    kubectl describe pdb <name> -n <namespace>
#
# 5. Common Issues:
#    - PDB too restrictive: Blocks node drains
#    - No PDB: Risk of downtime during maintenance
#    - minAvailable > replicas: Impossible to satisfy
#
# 6. PDB Status:
#    kubectl get pdb <name> -n <namespace> -o yaml
#    # Check status.currentHealthy, status.desiredHealthy, status.disruptionsAllowed
#
# 7. Integration with HPA:
#    - Use percentages or maxUnavailable for auto-scaling apps
#    - Avoid fixed minAvailable with HPA (can scale below minimum)
#
# 8. PDB and Rolling Updates:
#    - Ensure maxUnavailable + maxSurge allows updates
#    - Example: If maxUnavailable: 1 and PDB minAvailable: N-1,
#              updates will proceed one pod at a time
