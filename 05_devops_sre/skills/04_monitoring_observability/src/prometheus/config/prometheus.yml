# Production-grade Prometheus Configuration
# For use in Kubernetes or VM-based deployments

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

  external_labels:
    cluster: 'production-us-east-1'
    region: 'us-east-1'
    environment: 'production'
    prometheus_replica: '{{ .ReplicaID }}'  # For HA setups

# Alertmanager configuration
alerting:
  alert_relabel_configs:
    # Add cluster label to all alerts
    - source_labels: [cluster]
      target_label: cluster
      replacement: 'production-us-east-1'

  alertmanagers:
    - scheme: http
      path_prefix: /
      timeout: 10s
      api_version: v2
      static_configs:
        - targets:
            - 'alertmanager-0.alertmanager:9093'
            - 'alertmanager-1.alertmanager:9093'
            - 'alertmanager-2.alertmanager:9093'

# Rule files
rule_files:
  - '/etc/prometheus/rules/*.yml'

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    honor_labels: true
    static_configs:
      - targets:
          - 'localhost:9090'
        labels:
          team: 'sre'
          service: 'prometheus'

  # Alertmanager
  - job_name: 'alertmanager'
    static_configs:
      - targets:
          - 'alertmanager-0.alertmanager:9093'
          - 'alertmanager-1.alertmanager:9093'
          - 'alertmanager-2.alertmanager:9093'
        labels:
          team: 'sre'
          service: 'alertmanager'

  # Node Exporter - VM-based deployment
  - job_name: 'node'
    file_sd_configs:
      - files:
          - '/etc/prometheus/targets/nodes/*.json'
        refresh_interval: 5m
    relabel_configs:
      # Add instance name from filename
      - source_labels: [__meta_filepath]
        regex: '.*/([^/]+)\\.json'
        target_label: datacenter

  # Kubernetes nodes
  - job_name: 'kubernetes-nodes'
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/${1}/proxy/metrics

  # Kubernetes pods
  - job_name: 'kubernetes-pods'
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      # Only scrape pods with annotation prometheus.io/scrape=true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true

      # Use custom metrics path if specified
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)

      # Use custom port if specified
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__

      # Add namespace label
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: kubernetes_namespace

      # Add pod name label
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: kubernetes_pod_name

      # Add container name label
      - source_labels: [__meta_kubernetes_pod_container_name]
        action: replace
        target_label: kubernetes_container_name

      # Add app label
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: replace
        target_label: app

      # Add version label
      - source_labels: [__meta_kubernetes_pod_label_version]
        action: replace
        target_label: version

  # Kubernetes services
  - job_name: 'kubernetes-services'
    kubernetes_sd_configs:
      - role: service
    metrics_path: /probe
    params:
      module: [http_2xx]
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_probe]
        action: keep
        regex: true
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: blackbox-exporter:9115
      - source_labels: [__param_target]
        target_label: instance
      - action: labelmap
        regex: __meta_kubernetes_service_label_(.+)

  # Application metrics - API servers
  - job_name: 'api-server'
    consul_sd_configs:
      - server: 'consul.service.consul:8500'
        services: ['api-server']
    relabel_configs:
      - source_labels: [__meta_consul_service]
        target_label: job
      - source_labels: [__meta_consul_service_metadata_version]
        target_label: version
      - source_labels: [__meta_consul_tags]
        regex: '.*,env:([^,]+),.*'
        target_label: environment

  # PostgreSQL databases
  - job_name: 'postgres'
    static_configs:
      - targets:
          - 'postgres-exporter-primary:9187'
          - 'postgres-exporter-replica-1:9187'
          - 'postgres-exporter-replica-2:9187'
        labels:
          team: 'data'
          service: 'postgres'

  # Redis caches
  - job_name: 'redis'
    static_configs:
      - targets:
          - 'redis-exporter-cache:9121'
          - 'redis-exporter-session:9121'
        labels:
          team: 'backend'
          service: 'redis'

  # Blackbox exporter - HTTP probes
  - job_name: 'blackbox-http'
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files:
          - '/etc/prometheus/targets/blackbox-http/*.json'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Blackbox exporter - TCP probes
  - job_name: 'blackbox-tcp'
    metrics_path: /probe
    params:
      module: [tcp_connect]
    file_sd_configs:
      - files:
          - '/etc/prometheus/targets/blackbox-tcp/*.json'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Custom application exporter
  - job_name: 'custom-metrics'
    static_configs:
      - targets:
          - 'custom-exporter:9200'
        labels:
          team: 'backend'
          service: 'custom-app'

# Remote write (for long-term storage)
remote_write:
  - url: http://cortex:9009/api/prom/push
    queue_config:
      capacity: 10000
      max_shards: 50
      min_shards: 1
      max_samples_per_send: 5000
      batch_send_deadline: 5s
      min_backoff: 30ms
      max_backoff: 100ms
    write_relabel_configs:
      # Drop high-cardinality metrics
      - source_labels: [__name__]
        regex: 'go_gc_.*|process_.*'
        action: drop

# Remote read (from long-term storage)
remote_read:
  - url: http://cortex:9009/api/prom/read
    read_recent: true
