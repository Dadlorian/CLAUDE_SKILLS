# ArgoCD AppProject
# This example demonstrates a production AppProject with RBAC and resource restrictions

apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: production
  namespace: argocd
  # Finalizers are typically not needed for AppProjects
spec:
  description: Production environment applications

  # Source repositories that applications in this project can deploy from
  sourceRepos:
  - 'https://github.com/myorg/apps/*'
  - 'https://github.com/myorg/infrastructure/*'
  - 'https://charts.bitnami.com/bitnami'
  - 'https://prometheus-community.github.io/helm-charts'

  # Destination clusters and namespaces that apps can deploy to
  destinations:
  # Allow all namespaces in the default cluster
  - namespace: '*'
    server: https://kubernetes.default.svc
  # Allow specific namespaces in a remote cluster
  - namespace: 'prod-*'
    server: https://prod-cluster.example.com
    name: prod-cluster

  # Cluster-scoped resources that can be managed
  clusterResourceWhitelist:
  # Allow namespace creation
  - group: ''
    kind: Namespace
  # Allow RBAC resources
  - group: 'rbac.authorization.k8s.io'
    kind: ClusterRole
  - group: 'rbac.authorization.k8s.io'
    kind: ClusterRoleBinding
  # Allow cert-manager resources
  - group: 'cert-manager.io'
    kind: ClusterIssuer
  # Allow custom resource definitions
  - group: 'apiextensions.k8s.io'
    kind: CustomResourceDefinition

  # Namespace-scoped resources that can be managed
  namespaceResourceWhitelist:
  # Allow all resources
  - group: '*'
    kind: '*'

  # Resources that are explicitly denied
  namespaceResourceBlacklist:
  # Don't allow apps to create ResourceQuotas
  - group: ''
    kind: ResourceQuota
  # Don't allow apps to create LimitRanges
  - group: ''
    kind: LimitRange

  # RBAC roles for the project
  roles:
  # Developer role - can view and sync applications
  - name: developer
    description: Developers can view and sync applications
    policies:
    - p, proj:production:developer, applications, get, production/*, allow
    - p, proj:production:developer, applications, sync, production/*, allow
    - p, proj:production:developer, applications, override, production/*, allow
    - p, proj:production:developer, repositories, get, *, allow
    groups:
    - production-developers
    - engineering-team

  # Admin role - full access to applications in the project
  - name: admin
    description: Admins have full access to all applications
    policies:
    - p, proj:production:admin, applications, *, production/*, allow
    - p, proj:production:admin, repositories, *, *, allow
    - p, proj:production:admin, clusters, *, *, allow
    groups:
    - production-admins
    - platform-team

  # ReadOnly role - can only view applications
  - name: readonly
    description: ReadOnly users can view applications
    policies:
    - p, proj:production:readonly, applications, get, production/*, allow
    - p, proj:production:readonly, repositories, get, *, allow
    groups:
    - production-viewers
    - auditors

  # Sync windows - control when syncs can happen
  syncWindows:
  # Allow syncs during business hours on weekdays
  - kind: allow
    schedule: '0 9-17 * * 1-5'  # Mon-Fri 9am-5pm
    duration: 8h
    applications:
    - '*'
    manualSync: true  # Manual syncs are allowed during this window

  # Deny automated syncs on weekends
  - kind: deny
    schedule: '0 0 * * 0,6'  # Saturday and Sunday
    duration: 24h
    applications:
    - '*'
    manualSync: false  # Manual syncs are also denied

  # Deny syncs during maintenance windows
  - kind: deny
    schedule: '0 2-4 * * 1'  # Monday 2am-4am
    duration: 2h
    applications:
    - '*'
    manualSync: true  # But allow manual syncs if needed

  # Orphaned resources monitoring
  orphanedResources:
    # Warn about orphaned resources
    warn: true
    # Don't automatically delete orphaned resources
    ignore:
    - group: ''
      kind: ConfigMap
      name: kube-root-ca.crt  # Ignore this system ConfigMap

---
# AppProject for a development team
# This example shows a more restricted project for a specific team

apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: team-alpha
  namespace: argocd
spec:
  description: Team Alpha applications

  # Only allow team's repositories
  sourceRepos:
  - 'https://github.com/team-alpha/*'

  # Only allow deployment to team's namespaces
  destinations:
  - namespace: 'team-alpha-*'
    server: https://kubernetes.default.svc

  # Only allow namespace creation
  clusterResourceWhitelist:
  - group: ''
    kind: Namespace

  # Restrict to specific resource types
  namespaceResourceWhitelist:
  - group: 'apps'
    kind: Deployment
  - group: 'apps'
    kind: StatefulSet
  - group: 'apps'
    kind: DaemonSet
  - group: ''
    kind: Service
  - group: ''
    kind: ConfigMap
  - group: ''
    kind: Secret
  - group: ''
    kind: PersistentVolumeClaim
  - group: 'networking.k8s.io'
    kind: Ingress
  - group: 'networking.k8s.io'
    kind: NetworkPolicy
  - group: 'batch'
    kind: Job
  - group: 'batch'
    kind: CronJob
  - group: 'autoscaling'
    kind: HorizontalPodAutoscaler

  # Deny privileged resources
  namespaceResourceBlacklist:
  - group: ''
    kind: ResourceQuota
  - group: ''
    kind: LimitRange
  - group: 'rbac.authorization.k8s.io'
    kind: Role
  - group: 'rbac.authorization.k8s.io'
    kind: RoleBinding

  roles:
  - name: team-member
    description: Team member with sync access
    policies:
    - p, proj:team-alpha:team-member, applications, *, team-alpha/*, allow
    groups:
    - team-alpha

  # No sync windows - team can sync anytime
  syncWindows: []

  orphanedResources:
    warn: true
