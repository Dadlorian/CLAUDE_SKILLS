---
# CPU Usage
apiVersion: flagger.app/v1beta1
kind: MetricTemplate
metadata:
  name: cpu-usage
  namespace: production
spec:
  provider:
    type: prometheus
    address: http://prometheus.monitoring:9090
  query: |
    sum(
      rate(
        container_cpu_usage_seconds_total{
          namespace="{{ namespace }}",
          pod=~"{{ target }}-[a-z0-9]+-[a-z0-9]+"
        }[{{ interval }}]
      )
    ) by (pod)
    /
    sum(
      container_spec_cpu_quota{
        namespace="{{ namespace }}",
        pod=~"{{ target }}-[a-z0-9]+-[a-z0-9]+"
      }
      /
      container_spec_cpu_period{
        namespace="{{ namespace }}",
        pod=~"{{ target }}-[a-z0-9]+-[a-z0-9]+"
      }
    ) by (pod) * 100

---
# Memory Usage
