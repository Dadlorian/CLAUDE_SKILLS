---
# Datadog Metric Template Example
apiVersion: flagger.app/v1beta1
kind: MetricTemplate
metadata:
  name: datadog-success-rate
  namespace: production
spec:
  provider:
    type: datadog
    address: https://api.datadoghq.com
    secretRef:
      name: datadog
  query: |
    sum:requests.success{service:{{ target }}}.as_rate()
    /
    sum:requests.total{service:{{ target }}}.as_rate()

---
# New Relic Metric Template Example
apiVersion: flagger.app/v1beta1
kind: MetricTemplate
metadata:
  name: newrelic-error-rate
  namespace: production
spec:
  provider:
    type: newrelic
    address: https://api.newrelic.com/graphql
    secretRef:
      name: newrelic
  query: |
    {
      actor {
        account(id: 1234567) {
          nrql(query: "SELECT percentage(count(*), WHERE error IS true) FROM Transaction WHERE appName = '{{ target }}' SINCE {{ interval }} ago") {
            results
          }
        }
      }
    }

---
# CloudWatch Metric Template Example
apiVersion: flagger.app/v1beta1
kind: MetricTemplate
metadata:
  name: cloudwatch-request-count
  namespace: production
spec:
  provider:
    type: cloudwatch
    region: us-west-2
    secretRef:
      name: aws-credentials
  query: |
    [
      {
        "Id": "m1",
        "MetricStat": {
          "Metric": {
            "Namespace": "AWS/ApplicationELB",
            "MetricName": "RequestCount",
            "Dimensions": [
              {
                "Name": "TargetGroup",
                "Value": "{{ target }}"
              }
            ]
          },
          "Period": 60,
          "Stat": "Sum"
        }
      }
    ]

---
# Custom Application Metric: User Engagement
apiVersion: flagger.app/v1beta1
kind: MetricTemplate
metadata:
  name: user-engagement-score
  namespace: production
spec:
  provider:
    type: prometheus
    address: http://prometheus.monitoring:9090
  query: |
    (
      sum(rate(page_views_total{service="{{ target }}"}[{{ interval }}])) * 1.0 +
      sum(rate(button_clicks_total{service="{{ target }}"}[{{ interval }}])) * 2.0 +
      sum(rate(feature_usage_total{service="{{ target }}"}[{{ interval }}])) * 3.0
    )
    /
    sum(rate(sessions_total{service="{{ target }}"}[{{ interval }}]))

