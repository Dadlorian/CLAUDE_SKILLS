---
# Database Latency
apiVersion: flagger.app/v1beta1
kind: MetricTemplate
metadata:
  name: database-latency
  namespace: production
spec:
  provider:
    type: prometheus
    address: http://prometheus.monitoring:9090
  query: |
    histogram_quantile(0.95,
      sum(
        rate(
          database_query_duration_seconds_bucket{
            service="{{ target }}"
          }[{{ interval }}]
        )
      ) by (le)
    ) * 1000

