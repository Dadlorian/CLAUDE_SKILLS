# Centralized Metric Definitions
# Based on dbt Metrics + Airbnb Minerva patterns

version: 1

metrics:
  # Revenue Metrics
  - name: monthly_recurring_revenue
    label: Monthly Recurring Revenue (MRR)
    model: ref('fct_subscriptions')
    description: >
      Sum of all active subscription amounts at the end of the month.
      Excludes trials and cancelled subscriptions.
    
    calculation_method: sum
    expression: subscription_amount
    
    timestamp: subscription_date
    time_grains: [day, week, month, quarter, year]
    
    dimensions:
      - subscription_tier
      - customer_segment
      - region
      - acquisition_channel
    
    filters:
      - field: subscription_status
        operator: '='
        value: "'active'"
      - field: is_trial
        operator: '='
        value: 'false'
    
    meta:
      owner: finance_analytics_team
      certification: verified
      sla: daily_by_9am
      tags: [revenue, finance, subscription]

  - name: annual_recurring_revenue
    label: Annual Recurring Revenue (ARR)
    model: ref('fct_subscriptions')
    description: Monthly Recurring Revenue annualized (MRR × 12)
    
    calculation_method: derived
    expression: monthly_recurring_revenue * 12
    
    depends_on:
      - monthly_recurring_revenue
    
    meta:
      owner: finance_analytics_team
      certification: verified

  # User Engagement Metrics
  - name: daily_active_users
    label: Daily Active Users (DAU)
    model: ref('fct_user_events')
    description: Count of unique users with at least one session in a day
    
    calculation_method: count_distinct
    expression: user_id
    
    timestamp: event_timestamp
    time_grains: [day, week, month]
    
    dimensions:
      - platform
      - user_segment
      - country
    
    filters:
      - field: event_type
        operator: 'IN'
        value: "('session_start', 'page_view', 'feature_use')"
    
    meta:
      owner: product_analytics_team
      certification: verified
      tags: [engagement, product]

  - name: monthly_active_users
    label: Monthly Active Users (MAU)
    model: ref('fct_user_events')
    description: Count of unique users with at least one session in 30 days
    
    calculation_method: count_distinct
    expression: user_id
    
    timestamp: event_timestamp
    time_grains: [month, quarter]
    
    window:
      count: 30
      period: day
    
    dimensions:
      - platform
      - user_segment
      - country
    
    meta:
      owner: product_analytics_team
      certification: verified

  - name: stickiness
    label: User Stickiness (DAU/MAU)
    description: Ratio of daily to monthly active users
    
    calculation_method: ratio
    numerator: daily_active_users
    denominator: monthly_active_users
    
    format: percentage
    
    meta:
      owner: product_analytics_team
      certification: verified
      interpretation: >
        Higher is better. >40% is excellent, 20-40% is good, <20% needs improvement.

  # Customer Metrics
  - name: customer_acquisition_cost
    label: Customer Acquisition Cost (CAC)
    model: ref('fct_marketing_spend')
    description: Total marketing and sales spend divided by new customers acquired
    
    calculation_method: custom
    expression: >
      SUM(marketing_spend + sales_spend) / 
      COUNT(DISTINCT new_customers)
    
    timestamp: acquisition_date
    time_grains: [month, quarter, year]
    
    meta:
      owner: growth_team
      certification: verified
      tags: [marketing, finance]

  - name: customer_lifetime_value
    label: Customer Lifetime Value (LTV)
    model: ref('fct_orders')
    description: Total revenue generated by a customer over their entire lifetime
    
    calculation_method: sum
    expression: order_amount
    grain: customer_id
    
    filters:
      - field: order_status
        operator: '='
        value: "'completed'"
    
    meta:
      owner: customer_analytics_team
      certification: verified

  - name: ltv_cac_ratio
    label: LTV:CAC Ratio
    description: Lifetime value to customer acquisition cost ratio
    
    calculation_method: ratio
    numerator: customer_lifetime_value
    denominator: customer_acquisition_cost
    
    meta:
      owner: growth_team
      certification: verified
      interpretation: >
        Target >3.0. <1.0 is unsustainable, 1-3 is growth phase, >3 is healthy.

  # Retention Metrics
  - name: churn_rate
    label: Monthly Churn Rate
    model: ref('fct_subscriptions')
    description: Percentage of customers who cancelled in the month
    
    calculation_method: custom
    expression: >
      COUNT(DISTINCT CASE WHEN cancellation_date IS NOT NULL 
            THEN customer_id END) * 100.0 /
      COUNT(DISTINCT CASE WHEN subscription_status = 'active' AT START OF MONTH
            THEN customer_id END)
    
    timestamp: cancellation_date
    time_grains: [month, quarter]
    
    format: percentage
    
    meta:
      owner: customer_success_team
      certification: verified
      tags: [retention, customer_health]

  - name: net_revenue_retention
    label: Net Revenue Retention (NRR)
    model: ref('cohort_revenue')
    description: Revenue from a cohort vs. their starting revenue (includes expansion)
    
    calculation_method: custom
    expression: >
      (starting_revenue + expansion_revenue - churned_revenue - 
       contraction_revenue) / starting_revenue * 100
    
    format: percentage
    
    meta:
      owner: finance_analytics_team
      certification: verified
      interpretation: >
        >100% means expansion exceeds churn. Target >110% for SaaS.
