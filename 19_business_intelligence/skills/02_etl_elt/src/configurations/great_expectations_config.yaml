# Great Expectations Checkpoint Configuration

name: daily_data_quality_check
config_version: 1.0
class_name: SimpleCheckpoint
run_name_template: "%Y%m%d-%H%M%S"

validations:
  - batch_request:
      datasource_name: snowflake_datasource
      data_connector_name: default_inferred_data_connector
      data_asset_name: fct_orders
    expectation_suite_name: orders_suite

  - batch_request:
      datasource_name: snowflake_datasource
      data_connector_name: default_inferred_data_connector
      data_asset_name: dim_customers
    expectation_suite_name: customers_suite

action_list:
  - name: store_validation_result
    action:
      class_name: StoreValidationResultAction

  - name: update_data_docs
    action:
      class_name: UpdateDataDocsAction

  - name: send_slack_notification
    action:
      class_name: SlackNotificationAction
      slack_webhook: "${SLACK_WEBHOOK_URL}"
      notify_on: failure
      slack_channel: "#data-quality-alerts"
